<!-- 阶段5「复盘时间线」静态预览 · 基于评审合成方案「真相卷轴 · 战报回放 v2」（棋谱案数据工程 + 章节案叙事保底层嫁接）。
     纯静态假数据硬编码，不碰 src/；用户过目满意后才落地 ReviewPanel.tsx + review.css。 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小狼杀 · 阶段5 复盘时间线「真相卷轴」</title>
<style>
  /* ===========================================================
     阶段5「复盘时间线」= 真相卷轴 · 战报回放（v2 合成方案）
     骨架：单列纵向长页 + 侧边固定竖向时间轴（宽屏；≤1280px 退化为吸顶横条）+ 垂直轮次流。
     四幕：终局揭示（横幅+身份揭示墙+死亡缩略带）→ 侧边导航 →
           夜卡/天卡交替时间流 → 终局卡 + 幕后问答 + 按钮行。

     【落地纪律（写给未来落地 src/ 的自己）】
     1. ISO-002：完整真相只能在 review 阶段经 buildReviewContext 组装，
        本页一切「真相/真身/🐺」均以复盘态为前提，对局内绝不可见。
     2. 票数汇总只取 vote_resolved payload.tally（outcome / exiledPlayerId
        同帧取），votes 数组仅作逐票明细，绝不在组件里自数。
     3. 女巫救/毒【从不】出现在 nightActions —— 必须扫 events 的
        night_action_submitted(actionType=witch_save/witch_poison)，并与
        outcomes(deathCause='poison', killerIds=[女巫]) 交叉核对；含
        「救回所以 killed:false」「女巫空过 witchChoice=none」两个边角。
        落地收口在 shared/reviewRounds.ts 的 deriveRoundArchives（配 vitest：
        毒杀局 / 平票加赛局 / 猎人枪局 / 天1速胜单轮局），UI 只消费派生结构。
     4. 猎人开枪是独立 hunter_shot 事件（payload {hunterId,targetId}），
        时序归天卡头（天亮公布帧）。
     5. 一切「N号」取各 Ref 自带 seat 字段，绝不解析 playerId 后缀。
     6. 毒杀对局中一律显示「夜里出局」（规则铁律②），复盘揭示真相并
        标注对局内掩蔽措辞——本页夜2毒杀行即该措辞的视觉基准。
     7. 叙事保底区 = narrateEvent 兜底：已被结构化区覆盖的事件类型
        （night_action_resolved / player_died）去重跳过，其余照排——
        保证增强层漏扫也不丢信息。
     =========================================================== */
  :root{
    --bg-0:#14110c; --bg-1:#1c1813; --bg-2:#241f18; --bg-3:#2e2820; --line:#3a3328;
    --ink:#ece3d0; --ink-dim:#b3a78d; --ink-faint:#7d745f;
    --gold:#d8b25a; --gold-soft:#b8954a; --danger:#c0563f; --good:#6fae8f;
    --seat-1:#6fae8f; --seat-2:#d59a4e; --seat-3:#5b91c9; --seat-4:#b07cc4; --seat-5:#d4685a; --seat-6:#44b2a6;
    --radius:14px; --radius-sm:9px; --shadow:0 6px 22px rgba(0,0,0,.45); --t-fast:.18s; --t-mid:.35s;
    --serif:"Songti SC","STSong",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --vote-bg:#1d2530; --vote-line:#2f3f55; --vote-ink:#b9cbe2;
    --tk-save:#44b2a6; --tk-poison:#b07cc4; --tk-guard:#5b91c9;
    /* --nav-h = 导航占用的顶部高度：宽屏侧栏模式不占顶（0），≤1280px 吸顶横条模式在媒体查询里改回 */
    --demo-h:39px; --nav-h:0px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; overflow-x:hidden; } /* 宽内容一律各自 overflow-x:auto，body 永不横滚 */
  body{
    background:radial-gradient(1400px 700px at 50% -15%, #2a2418 0%, transparent 60%), var(--bg-0);
    color:var(--ink); font-family:var(--sans);
  }
  .nb{ white-space:nowrap; }
  ::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:#3a3328; border-radius:8px; }

  /* ============ demo 条（预览专用，落地时删除） ============ */
  .demo-bar{ position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    min-height:var(--demo-h); padding:5px 14px; background:#0d0b07; border-bottom:1px solid var(--line);
    font-size:13px; color:var(--ink-dim); }
  .demo-bar strong{ color:var(--gold); font-weight:600; }
  .demo-bar .spacer{ flex:1; }
  .demo-bar .lbl{ font-size:11.5px; color:var(--ink-faint); }
  .demo-bar button{ font:inherit; font-size:12.5px; cursor:pointer; padding:4px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg-3); color:var(--ink); }
  .demo-bar button:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .demo-bar button.on{ background:linear-gradient(180deg,#d8b25a,#b8954a); color:#2a210c; border-color:var(--gold-soft); }

  /* ============ 侧边固定导航（竖向时间轴 · 无框悬浮进度轨，宽屏默认；≤1280px 退化为吸顶横条见下方媒体查询）
     现代化要点：不再是带边框的卡片——一条纵向细轨贯穿全部节点，
     走过的节点实心填充、当前节点金色发光 + 微弱渐变底、悬停轻亮。 ============ */
  .navbar{ position:fixed; z-index:90; left:max(14px, calc(50% - 510px - 168px)); top:50%; transform:translateY(-50%);
    width:150px; max-height:calc(100vh - var(--demo-h) - 44px);
    overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
  .navbar::-webkit-scrollbar{ display:none; }
  .nav-inner{ position:relative; display:flex; flex-direction:column; align-items:stretch; gap:3px; padding:6px 0; }
  .nav-inner::before{ content:""; position:absolute; left:8px; top:20px; bottom:20px; width:2px; border-radius:2px;
    background:linear-gradient(180deg, transparent, var(--line) 12px, var(--line) calc(100% - 12px), transparent); }
  .np{ position:relative; flex:0 0 auto; font-family:var(--serif); font-size:13.5px; letter-spacing:1.5px;
    cursor:pointer; background:none; border:none; color:var(--ink-faint); text-align:left;
    padding:6px 10px 6px 26px; border-radius:9px; display:flex; align-items:center; gap:7px;
    transition:color var(--t-fast), background var(--t-fast); }
  .np::before{ content:""; position:absolute; left:3px; top:50%; transform:translateY(-50%); width:8px; height:8px;
    border-radius:50%; background:var(--bg-0); border:2px solid #56503f;
    transition:background var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast); }
  .np:hover{ color:var(--gold); }
  .np:hover::before{ border-color:var(--gold-soft); }
  .np.seen{ color:var(--ink-dim); }
  .np.seen::before{ background:var(--gold-soft); border-color:var(--gold-soft); }
  .np.cur{ color:var(--gold); font-weight:700; background:linear-gradient(90deg, rgba(216,178,90,.13), transparent 82%); }
  .np.cur::before{ background:var(--gold); border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(216,178,90,.16), 0 0 12px rgba(216,178,90,.4); }
  .np .np-dots{ display:flex; gap:3px; min-height:4px; margin-left:auto; }
  .np .np-dots i{ width:4px; height:4px; border-radius:50%; }
  .np-conn{ display:none; }
  .np.np-qa{ margin-top:14px; font-family:var(--sans); font-size:12.5px; letter-spacing:.5px; color:var(--vote-ink); opacity:.85; }
  .np.np-qa::before{ border-radius:2px; transform:translateY(-50%) rotate(45deg); border-color:var(--vote-line); background:var(--vote-bg); }
  .np.np-qa:hover{ color:#dce9f8; opacity:1; }
  .np.np-qa:hover::before{ border-color:var(--vote-ink); }
  .np.np-qa.cur{ background:linear-gradient(90deg, rgba(47,63,85,.45), transparent 82%); color:#dce9f8; font-weight:600; opacity:1; }
  .np.np-qa.cur::before{ background:var(--vote-ink); border-color:var(--vote-ink);
    box-shadow:0 0 0 4px rgba(185,203,226,.14), 0 0 10px rgba(185,203,226,.3); }
  .np.np-qa.pending{ animation:qaBreath 1.6s ease-in-out infinite; }
  @keyframes qaBreath{ 0%,100%{ box-shadow:0 0 0 0 rgba(185,203,226,0);} 50%{ box-shadow:0 0 0 4px rgba(185,203,226,.18);} }

  /* ≤1280px：主列两侧放不下侧栏，退化为吸顶横条（原药丸方案，样式在此整体恢复） */
  @media (max-width:1280px){
    :root{ --nav-h:48px; }
    .navbar{ position:sticky; left:auto; top:var(--demo-h); transform:none; width:auto; height:var(--nav-h); max-height:none;
      background:var(--bg-1); border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden; }
    .nav-inner{ flex-direction:row; align-items:center; margin:0 auto; height:100%; padding:0 16px; width:max-content; gap:2px; }
    .nav-inner::before{ display:none; }
    .np{ flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:3px 12px 2px;
      border-radius:999px; border:1px solid transparent; letter-spacing:1px; text-align:center; }
    .np::before{ display:none; }
    .np.seen{ color:var(--gold-soft); border-color:rgba(184,149,74,.45); background:none; }
    .np.cur{ background:linear-gradient(180deg,#d8b25a,#b8954a); color:#2a210c; border-color:var(--gold-soft); }
    .np.cur .np-dots i{ outline:1px solid rgba(42,33,12,.5); }
    .np .np-dots{ margin-left:0; height:3px; min-height:3px; }
    .np .np-dots i{ width:3px; height:3px; }
    .np-conn{ display:block; flex:0 0 auto; align-self:auto; width:14px; height:1px; background:var(--gold-soft); opacity:.35; }
    .np.np-qa{ margin-top:0; margin-left:10px; border-color:var(--vote-line); opacity:1; }
    .np.np-qa.cur{ background:var(--vote-bg); color:var(--vote-ink); border-color:var(--vote-ink); }
  }

  /* ============ 页身：单列卷轴 ============ */
  .page{ max-width:1020px; margin:0 auto; padding:26px 28px 90px; }

  /* ---- 第0幕 · 终局揭示：结果横幅 ---- */
  .hero{ scroll-margin-top:calc(var(--demo-h) + var(--nav-h) + 12px); }
  .banner{ text-align:center; padding:34px 20px 24px; border-radius:var(--radius); border:1px solid var(--line);
    box-shadow:var(--shadow); margin-bottom:18px; }
  .banner .b-kicker{ font-size:11.5px; letter-spacing:3px; color:var(--ink-faint); margin-bottom:10px; }
  .banner .b-title{ font-family:var(--serif); font-size:34px; letter-spacing:8px; color:var(--gold);
    text-shadow:0 0 22px rgba(216,178,90,.25); text-wrap:balance; }
  .banner .b-sub{ color:var(--ink-dim); font-size:13.5px; margin-top:10px; }
  .banner .b-hint{ color:var(--ink-faint); font-size:11.5px; margin-top:6px; }
  .banner.win-good{ background:linear-gradient(180deg, rgba(111,174,143,.12), rgba(0,0,0,.18)), var(--bg-1); border-color:#3b5748; }
  .banner.win-wolf{ background:linear-gradient(180deg, rgba(192,86,63,.15), rgba(0,0,0,.18)), var(--bg-1); border-color:#5a2c26; }
  .banner.win-wolf .b-title{ text-shadow:0 0 22px rgba(192,86,63,.3); }

  /* ---- 身份揭示墙（复用座位铭牌视觉词汇；复盘态 = 全 viewer 可见真相） ---- */
  .wall{ display:grid; grid-template-columns:repeat(auto-fit, minmax(118px, 1fr)); gap:10px;
    perspective:900px; margin-bottom:12px; }
  .wcard{ position:relative; background:var(--bg-2); border:1px solid var(--line); border-radius:12px;
    padding:13px 8px 11px; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
    animation:flipIn .5s ease-out both; animation-delay:calc(var(--i) * 80ms); }
  @keyframes flipIn{ from{ opacity:0; transform:rotateY(80deg); } }
  .wcard.fw{ border-color:rgba(192,86,63,.55); }
  .wcard.fg{ border-color:rgba(111,174,143,.35); }
  .wcard .w-wolfmark{ position:absolute; top:-8px; right:-6px; font-size:16px; filter:drop-shadow(0 1px 3px rgba(0,0,0,.8)); }
  .wav{ position:relative; display:inline-block; }
  .wcard.dead .wav .pav{ filter:grayscale(1) brightness(.55); }
  .wcard.dead .wav::after{ content:"✕"; position:absolute; inset:0; display:grid; place-items:center;
    color:rgba(220,90,70,.9); font-size:22px; font-weight:700; }
  .w-name{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:4px; }
  .w-no{ font-size:11px; color:var(--ink-faint); }
  .w-role{ font-family:var(--serif); font-size:13px; letter-spacing:2px; color:var(--gold); }
  .w-role.wolfr{ color:#e9a99c; }
  .wcard.dead .w-name{ color:var(--ink-dim); }

  /* 死因胶囊（复盘态直书真相；对局内的掩蔽版在夜卡里另有标注） */
  .dchip{ height:17px; padding:0 7px; border-radius:9px; font-size:10px; line-height:15px;
    background:#2a1815; color:#e0a89c; border:1px solid #5a2c26;
    display:inline-flex; align-items:center; gap:3px; white-space:nowrap; }
  .dchip .xn{ font-size:9px; font-style:normal; font-weight:700; color:var(--vote-ink); }
  .dchip.alive{ background:rgba(111,174,143,.12); border-color:#3b5748; color:var(--good); }

  /* ---- 死亡缩略带（全局→局部最快导航：点跳 + 金色脉冲） ---- */
  .strip{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:10px 14px;
    background:var(--bg-1); border:1px solid var(--line); border-radius:10px; margin-bottom:28px;
    font-size:12px; color:var(--ink-faint); }
  .strip .s-lbl{ letter-spacing:2px; font-size:11px; flex:0 0 auto; }
  .schip{ font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
    background:#2a1815; border:1px solid #5a2c26; color:#e0a89c; border-radius:999px;
    padding:3px 10px; font-size:11.5px; transition:border-color var(--t-fast), color var(--t-fast); }
  .schip:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .schip .xn{ font-size:9px; font-weight:700; color:var(--vote-ink); }
  .s-arr{ color:var(--ink-faint); flex:0 0 auto; }

  /* ============ 主体 · 垂直时间流（左缘贯穿竖线 + 节点圆点） ============ */
  .flow{ position:relative; padding-left:26px; }
  .flow::before{ content:""; position:absolute; left:8px; top:10px; bottom:10px; width:1px;
    background:linear-gradient(180deg, transparent, var(--line) 36px, var(--line) calc(100% - 36px), transparent); }
  .rwrap{ position:relative; margin-bottom:22px;
    /* scroll-margin 必须写在点跳目标（id 所在的 .rwrap/#finale）本身，写在子元素 .rcard 上不生效 */
    scroll-margin-top:calc(var(--demo-h) + var(--nav-h) + 16px); }
  .rwrap::before{ content:""; position:absolute; left:-23px; top:22px; width:10px; height:10px; border-radius:50%;
    background:var(--gold-soft); border:2px solid var(--bg-0); box-shadow:0 0 0 1px var(--gold-soft); }
  .rcard{ border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .rcard.night{ background:var(--bg-1); }
  .rcard.day{ background:var(--bg-2); position:relative; }
  .rcard.day::before{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(620px 150px at 50% 0, rgba(216,178,90,.07), transparent); }
  .rcard.fin{ background:var(--bg-1); border-color:rgba(184,149,74,.55); }
  .rhead{ display:flex; align-items:center; gap:10px; padding:13px 18px 12px; border-bottom:1px solid var(--line);
    font-family:var(--serif); font-size:16.5px; letter-spacing:3px; color:var(--gold); }
  .rhead .askbtn{ margin-left:auto; font-family:var(--sans); font-size:11.5px; letter-spacing:0; cursor:pointer;
    padding:4px 11px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink-faint); }
  .rhead .askbtn:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .rbody{ padding:14px 18px 16px; display:flex; flex-direction:column; gap:12px; }
  .sec-t{ font-size:11px; letter-spacing:2px; color:var(--ink-faint); }

  /* ---- 夜卡：行动真相区 ---- */
  .arow{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:7px 10px;
    background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:9px; font-size:13px; }
  .mp{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .mp b{ font-weight:600; }
  .mp .mp-no{ color:var(--ink-faint); font-size:11.5px; }
  .mp-you{ background:var(--gold); color:#2a210c; font-size:9.5px; padding:0 4px; border-radius:6px;
    line-height:13px; font-weight:700; flex:0 0 auto; }
  .pav{ display:inline-grid; place-items:center; border-radius:50%; color:#1b1610; font-weight:700;
    border:1px solid var(--line); flex:0 0 auto; user-select:none; }
  .atk{ width:21px; height:21px; border-radius:50%; display:inline-grid; place-items:center;
    font-size:11px; font-weight:700; border:1px solid var(--line); flex:0 0 auto; }
  .atk-kill{ background:rgba(192,86,63,.16); border-color:#5a2c26; color:#d98a76; }
  .atk-check{ background:rgba(91,145,201,.14); border-color:#33475e; color:var(--tk-guard); }
  .atk-save{ background:rgba(68,178,166,.12); border-color:#2e5751; color:var(--tk-save); }
  .atk-poison{ background:rgba(176,124,196,.14); border-color:#4f3a5c; color:var(--tk-poison); }
  .atk-none{ background:var(--bg-3); border-color:var(--line); color:var(--ink-faint); }
  .rb{ font-size:10.5px; padding:1px 7px; border-radius:8px; border:1px solid var(--line); white-space:nowrap; flex:0 0 auto; }
  .rb-bad{ background:rgba(192,86,63,.15); border-color:#5a2c26; color:#e9a99c; }
  .rb-good{ background:rgba(111,174,143,.14); border-color:#3b5748; color:var(--good); }
  .rb-saved{ background:rgba(68,178,166,.12); border-color:#2e5751; color:var(--tk-save); }
  .rb-poison{ background:rgba(176,124,196,.14); border-color:#4f3a5c; color:var(--tk-poison); }
  .rb-plain{ background:rgba(0,0,0,.3); color:var(--ink-dim); }
  .hid{ margin-left:auto; font-size:10px; color:var(--ink-faint); border:1px dashed var(--line);
    border-radius:7px; padding:1px 6px; white-space:nowrap; flex:0 0 auto; }
  .split{ width:100%; font-size:11.5px; color:var(--ink-dim); padding:5px 9px;
    background:rgba(192,86,63,.06); border:1px dashed #5a2c26; border-radius:7px; }
  .none-t{ color:var(--ink-dim); font-size:12.5px; }
  .empty{ font-size:12px; color:var(--ink-faint); padding:6px 10px; border:1px dashed var(--line);
    border-radius:8px; text-align:center; }

  /* ---- 死亡结算横幅（毒杀行 = 全页最大戏剧点） ---- */
  .dbn{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; padding:9px 12px; border-radius:9px;
    background:#241315; border:1px solid #5a2c26; font-size:13.5px; }
  .dbn .truth{ color:#e0a89c; font-weight:600; }
  .dbn.poison{ border-color:var(--tk-poison); box-shadow:0 0 0 1px rgba(176,124,196,.22); }
  .dbn.poison .truth{ color:var(--tk-poison); }
  .dbn .masked{ width:100%; font-size:11px; color:var(--ink-faint); }
  .peace{ text-align:center; font-family:var(--serif); color:var(--gold); letter-spacing:4px;
    padding:10px 0 6px; font-size:15.5px; }
  .peace small{ display:block; font-family:var(--sans); letter-spacing:1px; font-size:11px;
    color:var(--ink-faint); margin-top:5px; }

  /* ---- 叙事保底区（narrateEvent 兜底层；结构化区已覆盖的类型去重跳过） ---- */
  .narr{ display:flex; flex-direction:column; gap:5px; border-top:1px dashed var(--line); padding-top:9px; }
  .nline{ display:flex; align-items:baseline; gap:8px; font-size:12px; color:var(--ink-dim); }
  .nline .dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; transform:translateY(-1px); }
  .nd-phase{ background:var(--ink-faint); } .nd-death{ background:var(--danger); }
  .nd-vote{ background:var(--vote-ink); } .nd-words{ background:var(--gold-soft); } .nd-check{ background:var(--seat-3); }

  /* ---- 天卡：死讯 / 开枪 / 发言 / 投票 ---- */

/* ===================== 渲染 ===================== */
let CUR = 'good', S = null, P = null;
let SECS = [], curId = 'prologue', qaCtx = null;

const pav = (s, size) => {
  const p = P[s];
  return `<span class="pav" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .5)}px;background:${seatColor(s)}">${p.ch}</span>`;
};
const mp = s => {
  const p = P[s];
  return `<span class="mp">${pav(s, 20)}<b style="color:${seatColor(s)}">${p.name}</b><span class="mp-no">${s}号</span>${p.human ? '<span class="mp-you">你</span>' : ''}</span>`;
};
const nm = s => `<b class="nb" style="color:${seatColor(s)}">${s}号${P[s].name}</b>`;
const dchipHtml = d => `<span class="dchip">${d.label}${d.xn ? ` <i class="xn">${d.xn}</i>` : ''}</span>`;

function renderHero() {
  const wall = Object.keys(P).map((s, i) => {
    const p = P[+s];
    const dead = !!p.death;
    return `<div class="wcard ${p.faction === 'wolf' ? 'fw' : 'fg'} ${dead ? 'dead' : ''}" style="--i:${i}">
      ${p.faction === 'wolf' ? '<span class="w-wolfmark">🐺</span>' : ''}
      <span class="wav">${pav(+s, 46)}</span>
      <div class="w-name">${p.name}${p.human ? '<span class="mp-you">你</span>' : ''}</div>
      <div class="w-no">${s}号</div>
      <div class="w-role ${p.faction === 'wolf' ? 'wolfr' : ''}">${p.role}</div>
      ${dead ? dchipHtml(p.death) : '<span class="dchip alive">存活</span>'}
    </div>`;
  }).join('');
  const strip = S.deathOrder.length
    ? S.deathOrder.map(d =>
        `<button class="schip" data-target="${d.target}" title="点击跳转到对应轮次">☠ ${d.seat}号${P[d.seat].name} · ${d.label}${d.xn ? ` <i class="xn">${d.xn}</i>` : ''}</button>`
      ).join('<span class="s-arr">→</span>')
    : '<span>本局无人出局</span>';
  return `<section class="hero" id="prologue">
    <div class="banner ${S.winner === 'wolf' ? 'win-wolf' : 'win-good'}">
      <div class="b-kicker">— 复 盘 · 真 相 卷 轴 —</div>
      <div class="b-title">${S.winner === 'wolf' ? '🐺 ' : '🌾 '}${S.winTitle}</div>
      <div class="b-sub">${S.winReasonText}（${S.winReason}）· ${S.boardNote}</div>
      <div class="b-hint">身份与死因已全部揭示 · 点击时间轴节点或死亡时序可跳转对应轮次</div>
    </div>
    <div class="wall">${wall}</div>
    <div class="strip"><span class="s-lbl">死亡时序</span>${strip}</div>
  </section>`;
}

function actRow(a) {
  if (a.type === 'none') {
    return `<div class="arow">${mp(a.actor)}<span class="atk atk-none">空</span><span class="none-t">${a.text}</span><span class="hid">对局中隐藏</span></div>`;
  }
  let tk = '', res = '';
  if (a.type === 'kill') {
    tk = '<span class="atk atk-kill">刀</span>';
    res = a.saved ? '<span class="rb rb-saved">未死 · 被救</span>' : '<span class="rb rb-plain">得手</span>';
  } else if (a.type === 'check') {
    tk = '<span class="atk atk-check">验</span>';
    res = a.bad ? '<span class="rb rb-bad">查杀</span>' : '<span class="rb rb-good">金水</span>';
  } else if (a.type === 'save') {
    tk = '<span class="atk atk-save">救</span>';
    res = '<span class="rb rb-saved">解药</span>';
  } else if (a.type === 'poison') {
    tk = '<span class="atk atk-poison">毒</span>';
    res = '<span class="rb rb-poison">毒杀</span>';
  }
  return `<div class="arow">${mp(a.actor)}${tk}${mp(a.target)}${res}${a.note ? `<span class="rb rb-plain">${a.note}</span>` : ''}<span class="hid">对局中隐藏</span>${a.split ? `<div class="split">🐺 ${a.split}</div>` : ''}</div>`;
}

function narrHtml(narr) {
  if (!narr || !narr.length) return '';
  return `<div class="narr"><div class="sec-t" style="margin-bottom:2px">其余事件 · 叙事保底</div>` +
    narr.map(l => `<div class="nline"><i class="dot nd-${l.cls}"></i><span>${l.text}</span></div>`).join('') + '</div>';
}

function spRow(s, extraCls) {
  const p = P[s.seat];
  const tag = s.tag ? `<span class="sp-tag">${s.tag}</span>` : '';
  const long = s.text.length > 42;
  if (!long) {
    return `<div class="sp ${extraCls || ''}"><div class="sp-sum">${mp(s.seat)}${tag}<span class="excerpt">${s.text}</span></div></div>`;
  }
  return `<details class="sp ${extraCls || ''}"><summary>${mp(s.seat)}${tag}<span class="excerpt">${s.text.slice(0, 40)}…</span><span class="exp">展开全文 ▾</span></summary><div class="full">${s.text}</div></details>`;
}

function voteGroupRow(g, exiled) {
  const p = P[g.t];
  const chips = g.voters.map(v => `<span title="${v}号 ${P[v].name}">${pav(v, 16)}</span>`).join('');
  const names = g.voters.map(v => `${v}号`).join('·');
  return `<div class="vg ${exiled ? 'vg-exiled' : ''}">
    <span class="vg-arr">→</span>${pav(g.t, 18)}<b class="nb" style="color:${seatColor(g.t)}">${g.t}号${p.name}</b>
    <span class="vg-n">×${g.voters.length}</span><span class="vg-sep">｜</span>
    <span class="vg-chips">${chips}</span><span class="vg-names">${names}</span>
  </div>`;
}

function voteBlock(r) {
  if (!r.votes || !r.votes.length) return '';
  let html = '<div class="vblock">';
  let resultRow = '';
  r.votes.forEach((vr, i) => {
    html += `<div class="v-sub">🗳️ ${vr.sub}</div>`;
    const exiledSeat = vr.banner.type === 'exile' ? vr.banner.seat : -1;
    vr.groups.forEach(g => { html += voteGroupRow(g, g.t === exiledSeat); });
    if (vr.abstain && vr.abstain.length) {
      const names = vr.abstain.map(v => `${v}号${P[v].name}`).join('·');
      html += `<div class="vg abs"><span class="vg-arr">→</span><span>弃票</span><span class="vg-n" style="color:inherit">×${vr.abstain.length}</span><span class="vg-sep">｜</span><span class="vg-names" style="display:inline">${names}</span></div>`;
    }
    if (vr.banner.type === 'tie') {
      html += `<div class="tie-div">平票 · 加赛</div>`;
      html += `<div style="font-size:11px;opacity:.7;margin-bottom:4px">${vr.banner.text}</div>`;
      (r.tieSpeeches || []).forEach(ts => { html += spRow(ts); });
    } else if (vr.banner.type === 'exile') {
      const p = P[vr.banner.seat];
      const fac = p.faction === 'wolf' ? '<span class="fw">狼人</span>' : `<span class="fg">${p.role}（好人）</span>`;
      resultRow = `<div class="vres" id="d-seat${vr.banner.seat}">⚖ ${nm(vr.banner.seat)} 被放逐（${vr.banner.n}票）— 真身：${fac}</div>`;
    } else if (vr.banner.type === 'none') {
      resultRow = `<div class="vres">⚖ 平票 · 无人放逐，直接入夜</div>`;
    }
  });
  html += resultRow;
  html += `<div class="v-note">票数取自 vote_resolved.tally · 复盘态在 vote_resolved 之后，保密红线不约束</div>`;
  html += '</div>';
  return html;
}

function roundCard(r) {
  const id = `round-${r.kind}-${r.n}`;
  const label = r.kind === 'night' ? `第 ${r.n} 夜` : `第 ${r.n} 天`;
  const icon = r.kind === 'night' ? '☾' : '☀';
  let body = '';
  if (r.kind === 'night') {
    body += `<div class="sec-t">行动真相</div>` + r.actions.map(actRow).join('');
    if (r.emptyNote) body += `<div class="empty">${r.emptyNote}</div>`;
    body += `<div class="sec-t" style="margin-top:4px">死亡结算</div>`;
    if (r.peace) {
      body += `<div class="peace">🌙 平安夜<small>昨夜无人出局 — 刀被解药挡下（真相仅复盘可见）</small></div>`;
    } else {
      body += (r.deaths || []).map(d =>
        `<div class="dbn ${d.poison ? 'poison' : ''}" id="d-seat${d.seat}">☠ ${nm(d.seat)} 出局 — <span class="truth">真相：${d.truth}</span>${d.extra ? `<span class="rb rb-poison">${d.extra}</span>` : ''}${d.poison ? '<span class="masked">对局中显示为：夜里出局（死法不公布 · 规则铁律② · 复盘揭示真相）</span>' : ''}</div>`
      ).join('');
    }
  } else {
    body += `<div class="annc">☀ ${r.announce}</div>`;
    if (r.hunterShot) {
      const hs = r.hunterShot;
      body += `<div class="shot" id="d-seat${hs.target}">🔫 ${nm(hs.hunter)} 亮出猎人身份，开枪带走 ${nm(hs.target)} — 真身：<b style="color:#e9a99c">狼人</b></div>`;
    }
    if (r.speeches && r.speeches.length) {
      body += `<div class="sec-t">发言（点击展开全文）</div><div class="sp-list">${r.speeches.map(s => spRow(s)).join('')}</div>`;
    }
    body += voteBlock(r);
    if (r.lastWords) {
      body += `<div class="sec-t">遗言</div>` + spRow({ ...r.lastWords, tag: '遗言' }, 'lastw');
    }
    if (r.endNote) body += `<div class="endnote">🏁 ${r.endNote}</div>`;
  }
  body += narrHtml(r.narr);
  return `<section class="rwrap" id="${id}"><div class="rcard ${r.kind}">
    <div class="rhead">${icon} ${label}<button class="askbtn" data-round="${label.replace(/ /g, '')}">问这一轮</button></div>
    <div class="rbody">${body}</div>
  </div></section>`;
}

function renderFinale() {
  const alive = S.alive.map(s => `<span class="mp">${pav(s, 20)}${nm(s)}</span>`).join('');
  return `<section class="rwrap" id="finale"><div class="rcard fin">
    <div class="rhead">🏆 终局</div>
    <div class="rbody">
      <div class="fin-line">${S.winTitle} — ${S.winReasonText}</div>
      <div class="fin-sub">winReason = ${S.winReason} · ${S.finaleNarr}</div>
      <div class="fin-alive"><span class="sec-t">存活</span>${alive}</div>
    </div>
  </div></section>`;
}

function chipsFor(ctx) {
  switch (ctx) {
    case '第1夜': return ['第1夜狼人为什么分票？', '女巫首夜就用解药亏不亏？'];
    case '第1天': return ['天1为什么票会集中过去？', '平票加赛时我该改票吗？'];
    case '第2夜': return ['第2夜女巫这瓶毒用得对吗？', '狼人为什么选择刀猎人？'];
    case '第2天': return ['猎人开枪选这个目标是最优吗？'];
    default:      return ['我这局哪一步失误最大？', '狼队整体思路是什么？', '下一局我该怎么改进？'];
  }
}

function renderQA() {
  return `<section class="qa" id="qa">
    <h3>幕后问答</h3>
    <div class="qa-note">基于本局完整真相向 AI 追问 · 问答记录不会保存 · 单条问题上限 300 字</div>
    <div class="qlog" id="qlog">
      <div class="qmsg q">${S.qaPreset.q}</div>

    </div>
    <div class="chips" id="qa-chips"></div>
    <div class="qa-input">

    </div>

function renderNav() {
  SECS = [{ id: 'prologue', label: '序幕' }];
  S.rounds.forEach(r => SECS.push({
    id: `round-${r.kind}-${r.n}`,
    label: `${r.kind === 'night' ? '☾ 夜' : '☀ 天'}${r.n}`,
    dots: r.dots || [],
  }));
  SECS.push({ id: 'finale', label: '终局' });
  SECS.push({ id: 'qa', label: '问AI', qa: true });
  const inner = document.getElementById('nav-inner');
  inner.innerHTML = SECS.map((s, i) => {
    const dots = (s.dots || []).map(d => `<i style="background:${seatColor(d.seat)}"></i>`).join('');
    const tip = (s.dots || []).map(d => d.tip).join('；');
    const conn = (i > 0 && !s.qa) ? '<span class="np-conn"></span>' : '';
    return `${conn}<button class="np ${s.qa ? 'np-qa' : ''}" data-sec="${s.id}" ${tip ? `title="${tip}"` : ''}>
      <span>${s.label}</span><span class="np-dots">${dots}</span></button>`;
  }).join('');
}

function render(key) {
  CUR = key; S = SCRIPTS[key]; P = S.players; qaCtx = null;
  document.getElementById('page').innerHTML =
    renderHero() + `<div class="flow">${S.rounds.map(roundCard).join('')}${renderFinale()}</div>` + renderQA();
  renderNav();
  renderChips();
  curId = 'prologue';
  setActive('prologue');
  document.querySelectorAll('.sc-btn').forEach(b => b.classList.toggle('on', b.dataset.sc === key));
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function renderChips() {
  const box = document.getElementById('qa-chips');
  const lbl = qaCtx ? `围绕${qaCtx}` : '试着问问';
  box.innerHTML = `<span class="c-lbl">${lbl}：</span>` +
    chipsFor(qaCtx).map(t => `<button class="chip">${t}</button>`).join('');
}

/* ===================== 交互 ===================== */
function goTo(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' });
}
function setActive(id) {
  curId = id;
  const idx = SECS.findIndex(s => s.id === id);
  let curPill = null;
  document.querySelectorAll('.np').forEach(p => {
    const i = SECS.findIndex(s => s.id === p.dataset.sec);
    p.classList.toggle('cur', i === idx);
    p.classList.toggle('seen', i < idx);
    if (i === idx) curPill = p;
  });
  if (curPill) {
    const nav = document.getElementById('navbar');
    if (matchMedia('(min-width:1281px)').matches) {
      /* 侧栏模式：竖向滚动让当前节点居中 */
      const target = curPill.offsetTop - nav.clientHeight / 2 + curPill.clientHeight / 2;
      nav.scrollTo({ top: target, behavior: RM ? 'auto' : 'smooth' });
    } else {
      /* 吸顶横条模式：横向滚动让当前节点居中 */
      const target = curPill.offsetLeft - nav.clientWidth / 2 + curPill.clientWidth / 2;
      nav.scrollTo({ left: target, behavior: RM ? 'auto' : 'smooth' });
    }
  }
}

/* scroll-spy：以视口 40% 高度线为准，取最后一个越线的区块。
   短卡（平安夜）也稳定——不依赖 IntersectionObserver 阈值，无闪跳。 */
let spyTick = false;
function spy() {
  spyTick = false;
  const mid = window.scrollY + window.innerHeight * 0.4;
  let cur = SECS[0] && SECS[0].id;
  for (const s of SECS) {
    const el = document.getElementById(s.id);
    if (el && el.getBoundingClientRect().top + window.scrollY - 120 <= mid) cur = s.id;
  }
  if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 4) {
    cur = SECS[SECS.length - 1].id;
  }
  if (cur !== curId) setActive(cur);
}
window.addEventListener('scroll', () => { if (!spyTick) { spyTick = true; requestAnimationFrame(spy); } }, { passive: true });

/* 事件委托：导航点跳 / 死亡缩略带点跳+金脉冲 / 问这一轮 / 提问 chip / demo 切换 */
document.addEventListener('click', e => {
  const np = e.target.closest('.np');
  if (np) { goTo(np.dataset.sec); return; }
  const sc = e.target.closest('.schip');
  if (sc) {
    const el = document.getElementById(sc.dataset.target);
    if (el) {
      el.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'center' });
      el.classList.remove('pulse-hl'); void el.offsetWidth; el.classList.add('pulse-hl');
      setTimeout(() => el.classList.remove('pulse-hl'), 1300);
    }
    return;
  }
  const ask = e.target.closest('.askbtn');
  if (ask) {
    qaCtx = ask.dataset.round; renderChips();
    goTo('qa');
    const input = document.getElementById('qa-in');
    input.value = `关于${qaCtx}：`;
    setTimeout(() => input.focus({ preventScroll: true }), RM ? 0 : 450);
    return;
  }
  const chip = e.target.closest('.chip');
  if (chip) {
    const input = document.getElementById('qa-in');
    input.value = chip.textContent; input.focus({ preventScroll: true });
    return;
  }
  const scb = e.target.closest('.sc-btn');
  if (scb) { render(scb.dataset.sc); return; }
  if (e.target.closest('#qa-send')) sendQA();
});

function sendQA() {
  const input = document.getElementById('qa-in');
  const v = input.value.trim();
  if (!v) return;
  const log = document.getElementById('qlog');
  log.insertAdjacentHTML('beforeend', `<div class="qmsg q"></div>`);
  log.lastElementChild.textContent = v;
  input.value = '';
  const pendPill = document.querySelector('.np-qa');
  if (pendPill) pendPill.classList.add('pending');
  log.insertAdjacentHTML('beforeend',
    `<div class="qmsg a" id="qa-pending"><span class="typing"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span></div>`);
  log.querySelectorAll('#qa-pending .typing .dot').forEach(d => d.classList.add('dot'));
  setTimeout(() => {
    const p = document.getElementById('qa-pending');
    if (p) { p.removeAttribute('id'); p.textContent = '（静态预览示例回答）正式版中，这里会把整份 ReviewContext 连同你的问题发给 AI，由它基于完整真相作答。'; }
    if (pendPill) pendPill.classList.remove('pending');
  }, RM ? 0 : 900);
}

/* 键盘：←/→ 上一/下一区块，Home 序幕 / End 终局 */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  const ids = SECS.map(s => s.id);
  const i = ids.indexOf(curId);
  if (e.key === 'ArrowRight') { e.preventDefault(); goTo(ids[Math.min(i + 1, ids.length - 1)]); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(ids[Math.max(i - 1, 0)]); }
  else if (e.key === 'Home') { e.preventDefault(); goTo('prologue'); }
  else if (e.key === 'End') { e.preventDefault(); goTo('finale'); }
});

render('good');
</script>
