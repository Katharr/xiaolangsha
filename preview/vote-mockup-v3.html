<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小狼杀 · 圆桌剧场 v3「信息上桌」</title>
<style>
  /* ===========================================================
     圆桌剧场 v3「信息上桌 · 座位铭牌 Nameplate Ring」
     底稿 = vote-mockup-v2b.html（布局/token/开票动画/假数据全部继承）。
     本轮反馈：牌桌变大了但信息密度没跟上——桌面空、两侧面板压力大。
     核心动作：把「关于某个人的当前事实」全部锚定到他的座位铭牌上，
     面板同步收缩，全页密度均匀。

     【上桌清单（信息不重复：上桌即从面板删除）】
       · 座位件升级为铭牌：头像 + 名牌(.plate) + 徽标行(.p-row)
       · 私密圆 token（仅对应 viewer 可见，源 vi.privateEvents / vi.teammates）：
         查验｢狼/好｣ · 狼队｢狼｣ · 未得手的刀｢刀｣ · 女巫｢救/毒｣ · 守卫｢守｣(兼容)
       · 自己的身份 → own seat 角色胶囊 .tk-role（hover 职责文案）
         + 女巫两颗药剂 pip（实心=可用/空心=已用）→ 左列 idcard、topbar｢你是:X｣删除
       · 公开死因胶囊 chip：｢刀·夜2 / 逐·天1 ×3｣（×N=放逐票数持久层，
         严格绑定 vote_resolved 同帧）→ 左列 💀死亡公告整节删除
       · 桌心铭牌 .plaque（轮次 serif 金字 + 阶段 + 存活 x/y 三合一，
         投票中转 vote 蓝灰；夜晚时此处吃掉 nightStatus 播报）→ topbar 整行删除，
         回收 46px 喂桌径
       · dock 整条删除（铭牌即名单，chip 条逐字段重复）→ 再回收 72px

     【面板善后】左列只剩两节：🌙夜报（仅女巫/狼有内容才渲染，无座位锚点的
     流水兜底）+ 🗳️投票记录（过程档案，原样保留）。列宽 240–300 → 228–264，
     省出宽度喂牌桌。

     【硬规则（落地必守，评委嫁接项）】
       1. 座位四角各司其职：右上=身份(你/平)、左上=票数角标、右下永久留空
          作呼吸位；私密 token 与死因 chip 只进铭牌徽标行——禁止堆到同一角。
       2. 形状双通道：圆形 token=私密、胶囊/角标=公开；私密 tooltip 一律以
          ｢· 仅你可见｣结尾。
       3. token 时序：私密 token 全部产生于夜晚结算（天亮公告帧），投票进行中
          绝不新增/变化（不泄漏行动时序、不像计票）；毒杀 token 必须与公开
          死因牌同帧渲染，不得早于 death 事件。
       4. 票数/票向首次公开渲染点唯一且同帧 = vote_resolved payload
          （tally+votes；死因 chip 的 ×N 缀同帧）。VisibleVote.tally 恒
          undefined；弃票数只能数 payload.votes 的 abstain。
       5. ISO-001：铭牌 token 必须由 viewer 作用域 selector 从
          vi.privateEvents / vi.teammates 派生，座位组件不接触跨 viewer 数据；
          落地给预言家/狼/女巫/村民四视角各写 DOM 快照测试，断言互不含
          对方私密 token（本预览的｢视角｣按钮即此验收的手动版）。
       6. 徽标行溢出兜底：max 3 项、超出并作｢+N｣token（理论峰值=私密1+死因1，
          到不了 3）。
       7. 揭示不抢戏：reveal 态桌面既有 token/chip 临时降透明 ~2.6s 后恢复。

     Grid（外壳，topbar/dock 双删后）：
       "info table chat"   ← 单行三列，--chrome-h 185px → 66px，
     牌桌高度预算多出 ~118px（880px 上限不变，1440×900 下桌径 ~750px）。
     操作区仍折进右列 chat 内部 flex 底部（红线不变）。

     纯静态假数据，7 人标准局。各视角假数据为独立演示取样（狼队=你+沈舟
     与预言家查验史在一局真实对局中不必自洽——每次只看一个 viewer 的桌面）。
     =========================================================== */
  :root {
    --bg-0:#14110c; --bg-1:#1c1813; --bg-2:#241f18; --bg-3:#2e2820; --line:#3a3328;
    --ink:#ece3d0; --ink-dim:#b3a78d; --ink-faint:#7d745f;
    --gold:#d8b25a; --gold-soft:#b8954a; --danger:#c0563f; --good:#6fae8f;
    --seat-1:#6fae8f; --seat-2:#d59a4e; --seat-3:#5b91c9; --seat-4:#b07cc4; --seat-5:#d4685a; --seat-6:#44b2a6;
    --radius:14px; --radius-sm:9px; --shadow:0 6px 22px rgba(0,0,0,.45); --t-fast:.18s; --t-mid:.35s;
    --serif:"Songti SC","STSong",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    /* 投票蓝灰视觉系（felt 封桌 / vote-badge / notice.vote / vd-head / plaque.vote 同源） */
    --vote-bg:#1d2530; --vote-line:#2f3f55; --vote-ink:#b9cbe2;
    /* 私密 token 专用色（全部取自既有色板语义：红棕=狼、绿=金水、teal=救、紫=毒、蓝=守） */
    --tk-save:#44b2a6; --tk-poison:#b07cc4; --tk-guard:#5b91c9;
    /* 高度预算：topbar+dock 删除后只剩 demo条39 + table-wrap padding 24 + 边线≈3 */
    --demo-h:39px; --chrome-h:66px;
  }
  body.is-day { --bg-0:#1c1810; --bg-1:#28221a; --bg-2:#322a20; --bg-3:#3b3226; --ink:#f4ecda; }
  * { box-sizing:border-box; } html,body{ height:100%; margin:0; }
  body{ background:radial-gradient(1400px 700px at 50% -15%, #2a2418 0%, transparent 60%), var(--bg-0);
        color:var(--ink); font-family:var(--sans); overflow:hidden; }
  .nb{ white-space:nowrap; } /* 文案排版红线：意群防拆词 */

  .demo-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; height:var(--demo-h); padding:0 14px;
    background:#0d0b07; border-bottom:1px solid var(--line); font-size:13px; color:var(--ink-dim); }
  .demo-bar strong{ color:var(--gold); font-weight:600; } .demo-bar .spacer{ flex:1; }
  .demo-bar .dv{ width:1px; height:18px; background:var(--line); margin:0 2px; }
  .demo-bar .lbl{ font-size:12px; color:var(--ink-faint); }
  .demo-bar button{ font:inherit; font-size:12.5px; cursor:pointer; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg-3); color:var(--ink); }
  .demo-bar button:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .demo-bar button.on{ background:linear-gradient(180deg,#d8b25a,#b8954a); color:#2a210c; border-color:var(--gold-soft); }
  .demo-bar button.vw-btn.on{ background:var(--vote-bg); color:var(--vote-ink); border-color:var(--vote-line); }
  .demo-bar button:disabled{ opacity:.4; cursor:default; }
  .demo-bar button:disabled:hover{ border-color:var(--line); color:var(--ink); }

  /* ============ 外壳：单行三列（topbar / dock 双删） ============ */
  .frame{
    height:calc(100vh - var(--demo-h)); display:grid;
    /* 左列 240–300 → 228–264（票流图 vf-row 最低约 230px，不能再窄），
       省出的宽度喂给中列牌桌 */
    grid-template-columns: clamp(228px,16vw,264px) minmax(520px,1fr) clamp(400px,30vw,520px);
    grid-template-rows: minmax(0,1fr);
    grid-template-areas: "info table chat";
  }

  /* ============ 首字色块头像占位（静态稿不引 DiceBear） ============ */
  .pav{ display:inline-grid; place-items:center; border-radius:50%; background:var(--bg-3); color:#1b1610;
    font-weight:700; border:1px solid var(--line); flex:0 0 auto; user-select:none; overflow:hidden; }

  /* ============ 左：过程档案（夜报 + 投票记录，仅此两节） ============ */
  .info{ grid-area:info; border-right:1px solid var(--line); background:rgba(0,0,0,.22);
         display:flex; flex-direction:column; min-height:0; }
  .info-head{ padding:11px 14px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink-faint); letter-spacing:1px; }
  .info-head b{ color:var(--gold); font-weight:600; }
  .info-body{ flex:1; overflow-y:auto; padding:13px 12px 18px; display:flex; flex-direction:column; gap:14px; }
  .psec h4{ margin:2px 2px 9px; font-size:12.5px; font-weight:600; color:var(--ink-faint); letter-spacing:1px; }
  .psec{ display:flex; flex-direction:column; gap:8px; }

  /* 夜报行（无座位锚点信息的流水兜底：女巫倒牌/平安夜、狼空刀；
     救回细节归座位 token，此处不重复。hover 联动对应座位外晕。） */
  .nrow{ display:flex; align-items:baseline; gap:8px; padding:7px 9px; border-radius:8px;
    background:var(--bg-1); border:1px solid var(--line); font-size:12.5px; cursor:default; }
  .nrow:hover{ border-color:var(--ink-faint); }
  .nrow .n-when{ font-size:11px; color:var(--ink-faint); flex:0 0 auto; }

  /* ---- 投票记录：按天折叠卡（原样保留，过程档案是左列唯一大节） ---- */
  .vote-day{ border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .vote-day + .vote-day{ margin-top:8px; }
  .vd-head{ display:flex; align-items:center; gap:8px; padding:7px 10px; cursor:pointer; user-select:none;
    background:var(--vote-bg); color:var(--vote-ink); font-size:12.5px; font-weight:600; }
  .vd-head:hover{ background:#222d3b; }
  .vd-arrow{ font-size:10px; color:var(--ink-faint); transition:transform var(--t-fast); flex:0 0 auto; }
  .vote-day.open .vd-arrow{ transform:rotate(90deg); }
  .vd-sum{ margin-left:auto; font-weight:400; font-size:11.5px; color:var(--ink-faint); }
  .vd-body{ display:none; padding:4px 10px 10px; border-top:1px solid var(--vote-line); }
  .vote-day.open .vd-body{ display:block; }
  .vr{ padding:7px 0 3px; }
  .vr + .vr{ border-top:1px dashed var(--line); }
  .vr-sub{ font-size:11px; color:var(--ink-faint); letter-spacing:1px; margin:2px 0 6px; }

  /* ---- 票流图 ----
     数据口径（落地防坑）：
       · VisibleVote.tally 永远 undefined，票数只能取 vote_resolved payload.tally
       · 弃票人数必须数 payload.votes 里 choiceType==='abstain'（tally 不含弃票）
       · 【保密口径】进行中一轮只渲染「🕐 暗投进行中 · 开票时公示」一行；
         viewer 自己的票向只在操作区 vote-confirm 出现（全页唯一出口）。
       · 【记录↔座位联动】投票人 chips / 目标 hover → 对应座位 .hl 外晕，
         把档案条目翻译回「桌上的那个人」。 */
  .vf-row{ display:flex; align-items:center; gap:4px; padding:3px 0; font-size:12px; }
  .vf-chips{ display:flex; padding-left:5px; flex:0 0 auto; }
  .vf-chips .pav{ margin-left:-5px; border-color:var(--bg-0); }
  .vf-arr{ color:var(--ink-faint); font-size:11px; flex:0 0 auto; }
  .vf-tgt{ display:flex; align-items:center; gap:5px; flex:0 0 auto; white-space:nowrap; font-size:12px; }
  .vf-bar{ flex:1; height:6px; border-radius:3px; background:rgba(0,0,0,.35); overflow:hidden; min-width:18px; }
  .vf-bar i{ display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,var(--gold-soft),var(--gold)); }
  .vf-row.exiled .vf-bar i{ background:linear-gradient(90deg,#8f3b2a,var(--danger)); }
  .vf-n{ flex:0 0 auto; font-size:12.5px; font-weight:700; color:var(--gold); min-width:14px; text-align:right; }
  .vf-row.abs .vf-n{ color:var(--ink-faint); font-weight:400; }
  .vf-row.abs .vf-tgt{ color:var(--ink-faint); }
  .vf-banner{ margin-top:6px; padding:5px 9px; border-radius:7px; font-size:12px; font-weight:600; text-wrap:balance; }
  .vf-banner.exile{ background:#2c2615; border:1px solid #4a3f1d; color:#e7d29a; }
  .vf-banner.tie{ background:var(--vote-bg); border:1px solid var(--vote-line); color:var(--vote-ink); }
  .vf-pending{ font-size:11.5px; color:var(--ink-faint); padding:3px 0; }
  .vf-mine{ font-size:12px; color:var(--vote-ink); padding:2px 0; }
  .vote-sec.flash{ animation:secFlash 1.5s ease-out 2; border-radius:10px; }
  @keyframes secFlash{ 0%{ box-shadow:0 0 0 0 rgba(216,178,90,0);} 30%{ box-shadow:0 0 0 3px rgba(216,178,90,.4);} 100%{ box-shadow:0 0 0 0 rgba(216,178,90,0);} }

  /* ============ 中：牌桌（视觉主体 + 信息主体） ============ */
  .table-wrap{ grid-area:table; min-height:0; min-width:0;
    display:flex; align-items:center; justify-content:center; padding:12px; }
  /* 三重封顶继承：列宽 / 高度预算(--chrome-h，已因 topbar+dock 删除缩到 66px) /
     硬上限 880px。z-index:5 → 座位 tooltip 越界伸进右列时仍在上层。 */
  .table{ position:relative; aspect-ratio:1/1; z-index:5;
    width:min(100%, calc(100vh - var(--chrome-h)), 880px);
    width:min(100%, calc(100dvh - var(--chrome-h)), 880px);
    container-type:inline-size; container-name:table; }
  .felt{ position:absolute; inset:5%; border-radius:50%;
    background:radial-gradient(closest-side,#2b3a2f 0%,#223026 70%,#1b271e 100%);
    border:1px solid #34433a; box-shadow:inset 0 0 60px rgba(0,0,0,.55), var(--shadow);
    transition:box-shadow .5s ease, border-color .5s ease; }
  body.is-day .felt{ background:radial-gradient(closest-side,#34442f 0%,#2a3826 70%,#232f20 100%); }
  .table.veiled .felt{ border-color:var(--vote-line);
    box-shadow:inset 0 0 90px rgba(47,63,85,.5), var(--shadow); }
  /* 开票金脉冲（嫁接 B）：vote_resolved 瞬间 0.8s 单次，与 veiled 辉光褪去同帧衔接 */
  .felt.pulse{ animation:feltPulse .8s ease-out 1; }
  @keyframes feltPulse{
    0%{ box-shadow:inset 0 0 60px rgba(0,0,0,.55), 0 0 0 0 rgba(216,178,90,.5), var(--shadow); }
    100%{ box-shadow:inset 0 0 60px rgba(0,0,0,.55), 0 0 0 30px rgba(216,178,90,0), var(--shadow); } }

  /* ---- 桌心铭牌 .plaque（嫁接 B）：轮次+阶段+存活三合一，topbar 的替身。
       位置 = 舞台上方环带留白（top 23.5%，顶位座位铭牌与 reveal 面板之间）。
       夜晚时此处显示 vi.nightStatus 播报（如「夜晚 · 女巫行动中…」，非机密），
       旁观时缀灰 tag「旁观中」——本 5 态演示均为白天故未出现。 ---- */
  .plaque{ position:absolute; left:50%; top:23.5%; transform:translate(-50%,-50%); z-index:1;
    display:flex; align-items:baseline; gap:10px; padding:7px 16px 8px; border-radius:10px;
    background:rgba(13,11,7,.5); border:1px solid rgba(216,178,90,.35);
    box-shadow:0 2px 12px rgba(0,0,0,.35); transition:border-color var(--t-mid), background var(--t-mid); }
  .plaque .pq-round{ font-family:var(--serif); font-size:16.5px; letter-spacing:2px; color:var(--gold); }
  .plaque .pq-phase{ font-size:12.5px; color:var(--ink-dim); }
  .plaque .pq-alive{ font-size:11.5px; color:var(--ink-faint); }
  .plaque.vote{ background:rgba(29,37,48,.6); border-color:var(--vote-line); }
  .plaque.vote .pq-phase{ color:var(--vote-ink); }

  /* ---- 中央舞台（veil / reveal / speech 三态，v2b 原样继承；
          stage 优先级：投票态判定必须排在 isNight 之前） ---- */
  .stage{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2;
    width:46%; max-width:360px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;
    animation:stageIn .28s ease-out both; }
  @keyframes stageIn{ from{ opacity:0; } }
  .stage .spk-av{ border:2px solid var(--gold) !important;
    box-shadow:0 0 0 4px rgba(216,178,90,.3), 0 0 24px rgba(216,178,90,.5); }
  .stage .spk-name{ font-size:15px; color:var(--gold); font-weight:600; }
  .stage .spk-line{ font-size:13px; color:var(--ink-dim); line-height:1.55; max-height:4.65em; overflow:hidden; }

  .stage.veil{ width:60%; max-width:340px; gap:9px; }
  .stg-title{ font-family:var(--serif); font-size:20px; letter-spacing:5px; color:var(--gold); text-wrap:balance; }
  .stage.veil .stg-title{ text-shadow:0 0 18px rgba(216,178,90,.35); }
  .stg-sub{ font-size:13px; color:var(--vote-ink); display:inline-flex; align-items:baseline; gap:5px; text-wrap:balance; }
  .veil-note{ font-size:11.5px; color:var(--ink-faint); text-wrap:balance; }
  .vbox{ position:relative; width:76px; height:54px; margin-top:14px;
    border:2px solid var(--gold-soft); border-radius:10px;
    background:linear-gradient(180deg, rgba(216,178,90,.08), rgba(0,0,0,.25));
    animation:vboxGlow 2.6s ease-in-out infinite; }
  @keyframes vboxGlow{ 0%,100%{ box-shadow:0 0 10px rgba(216,178,90,.15); }
                       50%{ box-shadow:0 0 26px rgba(216,178,90,.45); } }
  .vbox::before{ content:""; position:absolute; left:50%; top:0; transform:translate(-50%,-50%);
    width:36px; height:6px; border-radius:3px; background:var(--gold-soft);
    box-shadow:0 0 8px rgba(216,178,90,.5); }
  .vbox::after{ content:""; position:absolute; left:50%; top:-28px; transform:translateX(-50%) rotate(4deg);
    width:22px; height:14px; border-radius:2px;
    background:linear-gradient(180deg,#e8d9ae,#cdb684); opacity:0;
    animation:slipDrop 3s ease-in .8s infinite; }
  @keyframes slipDrop{ 0%{ opacity:0; top:-30px; } 14%{ opacity:.95; }
    46%{ top:-6px; opacity:.95; } 58%{ top:-1px; opacity:0; } 100%{ opacity:0; } }

  /* reveal 开票榜（stagger 参数/触发纪律/溢出纪律与 v2b 完全一致，注释见底稿） */
  .stage.reveal{ width:50%; max-width:370px; padding:14px 16px 16px; gap:5px;
    background:rgba(20,17,12,.6); border:1px solid var(--vote-line); border-radius:var(--radius); }
  .stage.reveal .stg-title{ font-size:15px; letter-spacing:2px; }
  .rv-list{ width:100%; display:flex; flex-direction:column; gap:3px; margin-top:6px; }
  .rv-row{ display:flex; align-items:center; gap:8px; height:30px; width:100%;
    animation:rvIn .22s ease-out both; animation-delay:var(--d,0s); }
  @keyframes rvIn{ from{ opacity:0; transform:translateY(6px); } }
  .rv-name{ font-size:13px; white-space:nowrap; }
  .rv-chips{ display:flex; margin-left:auto; padding-left:6px; }
  .rv-chips .pav{ margin-left:-6px; border-color:var(--bg-0); animation:popIn .2s ease-out both; animation-delay:var(--dc,0s); }
  @keyframes popIn{ from{ opacity:0; transform:scale(.4); } }
  .rv-n{ flex:0 0 auto; font-size:15px; font-weight:700; color:var(--gold); min-width:18px; text-align:right; }
  .rv-row.abs .rv-n{ color:var(--ink-faint); font-weight:400; }
  .rv-row.abs .rv-name{ color:var(--ink-faint); }
  .stage.reveal.exile .rv-row{ animation:rvIn .22s ease-out both, rvShrink .25s ease-out both;
    animation-delay:var(--d,0s), var(--dv,1s); }
  @keyframes rvShrink{ to{ height:22px; opacity:.72; } }
  .rv-verdict{ margin-top:7px; display:flex; flex-direction:column; align-items:center; gap:6px;
    animation:rvIn .28s ease-out both; animation-delay:var(--dv,1s); }
  .rv-exile-av{ border:2.5px solid var(--danger) !important;
    box-shadow:0 0 0 4px rgba(192,86,63,.3), 0 0 26px rgba(192,86,63,.5); }
  .rv-ties{ display:flex; gap:12px; }
  .rv-tie-av{ border:2px solid var(--gold) !important; animation:tie-pulse 1.2s ease-in-out infinite; }
  @keyframes tie-pulse{ 0%,100%{ box-shadow:0 0 0 2px rgba(216,178,90,.35);} 50%{ box-shadow:0 0 0 6px rgba(216,178,90,.15);} }
  .rv-verdict .vtext{ font-size:14px; font-weight:700; color:var(--gold); text-wrap:balance; line-height:1.5; }
  .rv-verdict .vtext .dim{ color:var(--ink-dim); font-weight:400; }

  /* ---- 座位铭牌（核心升级）：avatar + .plate（名牌 + 徽标行） ----
       y 半径 44% → 42%（铭牌增高 ~18px，720px 桌顶位座位仍留 ≥4px）。
       【四角制度】右上=身份(你/平) / 左上=票数 / 右下永久留空 /
       徽标行=私密 token + 死因 chip。 ---- */
  .seat{ position:absolute; transform:translate(-50%,-50%); width:112px;
    display:flex; flex-direction:column; align-items:center; gap:0; text-align:center; }
  .seat:hover{ z-index:20; } /* tooltip 压过邻座 */
  /* 角标层：badge/vote-badge 挂在 .avwrap 而非 .avatar 内——
     .avatar overflow:hidden 会把负偏移角标裁掉（v2b 遗留 bug，本版修正） */
  .avwrap{ position:relative; }
  .seat .avatar{ width:64px; height:64px; border-radius:50%; background:var(--bg-3); border:2px solid var(--line);
    overflow:hidden; position:relative; box-shadow:0 2px 10px rgba(0,0,0,.4); }
  .seat .avatar .ch{ position:absolute; inset:0; display:grid; place-items:center; font-size:26px; font-weight:700; color:#1b1610; }
  .seat .badge{ position:absolute; top:-4px; right:-4px; font-size:10px; padding:0 5px; border-radius:8px; line-height:16px; border:1px solid var(--line); z-index:2; }
  .seat .badge.you{ background:var(--gold); color:#2a210c; border-color:var(--gold); }
  .seat.dead .avatar{ filter:grayscale(1) brightness(.5); border-color:#2c2820; }
  .seat.dead .avatar::after{ content:"✕"; position:absolute; inset:0; display:grid; place-items:center; color:rgba(220,90,70,.85); font-size:30px; font-weight:700; }

  .plate{ margin-top:3px; max-width:112px; background:rgba(0,0,0,.38); border:1px solid var(--line);
    border-radius:8px; padding:3px 7px 4px; display:flex; flex-direction:column; gap:2px; align-items:center; }
  .p-name{ font-size:12.5px; white-space:nowrap; font-weight:600; }
  .p-name .no{ color:var(--ink-faint); font-weight:400; }
  .p-row{ display:flex; gap:3px; justify-content:center; align-items:center; }
  .p-st{ font-size:10.5px; color:var(--gold); }
  /* 死亡：铭牌整体降 .75 但 token 保留（查验/救毒痕迹 = 局内小复盘） */
  .seat.dead .plate{ opacity:.75; }
  .seat.dead .p-name{ color:var(--ink-faint) !important; text-decoration:line-through; }

  /* 票数角标：固定左上（右上留给 badge.you/tie）。只在 vote_resolved 之后出现——
     投票进行中座位环上零 vote 相关标记（保密红线）。 */
  .seat .vote-badge{ position:absolute; left:-5px; top:-5px; min-width:20px; height:20px; padding:0 4px;
    border-radius:10px; background:var(--vote-bg); border:1px solid var(--vote-line); color:var(--vote-ink);
    font-size:11.5px; font-weight:700; line-height:18px; text-align:center; z-index:2;
    animation:popIn var(--t-fast) ease-out both; animation-delay:var(--d,0s); }
  .seat .vote-badge.exiled{ background:var(--danger); border-color:#8f3b2a; color:#fff; }
  .seat.dead .vote-badge{ opacity:.6; }
  /* 平票候选（公开）：头像环通道专属公开态——私密标记永不占环 */
  .seat.tied .avatar{ border-color:var(--vote-line); box-shadow:0 0 0 3px rgba(47,63,85,.8), 0 0 0 6px rgba(47,63,85,.35), 0 2px 10px rgba(0,0,0,.4); }
  .seat .badge.tie{ background:var(--vote-bg); color:var(--vote-ink); border-color:var(--vote-line); }
  /* 记录↔座位联动外晕（嫁接 B）+ 操作瞄准环（嫁接 A） */
  .seat.hl .avatar{ box-shadow:0 0 0 2px var(--line), 0 0 16px rgba(179,167,141,.4), 0 2px 10px rgba(0,0,0,.4); }
  .seat.aim .avatar{ outline:2px dashed var(--gold-soft); outline-offset:3px; }

  /* ---- 私密圆 token（17px 圆、单汉字、圆=私密的形状编码） ---- */
  .tk{ width:17px; height:17px; border-radius:50%; font-size:10px; font-weight:700; line-height:1;
    display:inline-grid; place-items:center; border:1px solid var(--line); cursor:default; flex:0 0 auto;
    transition:transform var(--t-fast), opacity var(--t-mid); animation:popIn .18s ease-out both; }
  .tk:hover{ transform:scale(1.15); }
  .tk-wolf{ background:#3a1d18; border-color:#5a2c26; color:#e9a99c; }
  .tk-good{ background:rgba(111,174,143,.14); border-color:#3b5748; color:var(--good); }
  .tk-save{ background:rgba(68,178,166,.12); border-color:#2e5751; color:var(--tk-save); }
  .tk-poison{ background:rgba(176,124,196,.12); border-color:#4f3a5c; color:var(--tk-poison); }
  .tk-guard{ background:rgba(91,145,201,.12); border-color:#33475e; color:var(--tk-guard); }
  .tk-more{ background:var(--bg-3); color:var(--ink-dim); }
  /* 未得手的刀：danger 系整体 .7 + 斜杠伪元素 */
  .tk-knife{ background:rgba(192,86,63,.14); border-color:#5a2c26; color:#d98a76; opacity:.7; position:relative; }
  .tk-knife::before{ content:""; position:absolute; left:1px; right:1px; top:50%; height:1px;
    background:currentColor; transform:rotate(-32deg); }

  /* 角色胶囊（own seat 专属，胶囊=公开形状但只渲染给自己——身份卡的归宿） */
  .tk-role{ height:16px; padding:0 7px; border-radius:8px; font-size:10px; line-height:14px; flex:0 0 auto;
    color:var(--gold); border:1px solid var(--gold-soft); background:rgba(216,178,90,.08);
    display:inline-flex; align-items:center; cursor:default; transition:opacity var(--t-mid); }
  .tk-role.wolfy{ color:#e9a99c; border-color:#5a2c26; background:rgba(192,86,63,.1); }
  /* 女巫药剂 pip：实心=可用 / 空心+.45=已用 */
  .pip{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; cursor:default; transition:opacity var(--t-mid); }
  .pip-save{ background:var(--tk-save); border:1px solid #2e5751; }
  .pip-poison{ background:var(--tk-poison); border:1px solid #4f3a5c; }
  .pip.used{ background:transparent; opacity:.45; }
  .pip.used.pip-save{ border-color:var(--tk-save); }
  .pip.used.pip-poison{ border-color:var(--tk-poison); }

  /* 公开死因胶囊 chip（全员同款）：「刀·夜2 / 逐·天1 ×3」。
     ×N = 放逐票数持久层（嫁接 C），严格绑定 vote_resolved 同帧、--vote-ink 色域 */
  .dchip{ height:16px; padding:0 6px; border-radius:8px; font-size:10px; line-height:14px; flex:0 0 auto;
    background:#2a1815; color:#e0a89c; border:1px solid #5a2c26; cursor:default;
    display:inline-flex; align-items:center; gap:3px; white-space:nowrap;
    transition:opacity var(--t-mid); animation:popIn .18s ease-out both; animation-delay:var(--d,0s); }
  .dchip .xn{ font-size:9px; font-style:normal; font-weight:700; color:var(--vote-ink); }

  /* 揭示不抢戏：reveal 态桌面既有 token/chip 临时降透明，~2.6s 后由 JS 摘类恢复 */
  .table.revealing .tk, .table.revealing .tk-role,
  .table.revealing .dchip, .table.revealing .pip{ opacity:.3; }
  /* 本轮宣判新生的死因 chip 是揭示叙事的一部分，不参与「既有标记退让」 */
  .table.revealing .dchip.fresh{ opacity:1; }

  /* ---- 自绘 tooltip（.tt + data-tip）：延迟 .15s 淡入、触屏 tap 切换(.tip-on)。
       私密文案一律以「· 仅你可见」结尾；.s-top 座位向下弹防桌缘裁切。 ---- */
  .tt{ position:relative; }
  .tt[data-tip]::after{ content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 7px);
    transform:translateX(-50%); background:rgba(13,11,7,.95); border:1px solid var(--line);
    color:var(--ink); font-size:11.5px; font-weight:400; line-height:1.4; padding:4px 9px; border-radius:7px;
    white-space:nowrap; opacity:0; pointer-events:none; transition:opacity var(--t-fast) ease .15s; z-index:80; }
  .tt[data-tip]:hover::after, .tt.tip-on[data-tip]::after{ opacity:1; }
  .s-top .tt[data-tip]::after{ bottom:auto; top:calc(100% + 7px); }

  /* ---- ❔ 图例（嫁接 C）：table 左下方角留白的幽灵圆钮，按 viewer 只列他见得到的种类 ---- */
  .lg-btn{ position:absolute; left:8px; bottom:8px; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--line); background:rgba(0,0,0,.3); color:var(--ink-faint);
    font:inherit; font-size:13px; line-height:1; cursor:pointer; z-index:6; }
  .lg-btn:hover{ color:var(--gold); border-color:var(--gold-soft); }
  .lg-btn.remind{ animation:lgPulse 2s ease-in-out 1; } /* 首枚 token 落桌/切视角时单次提醒 */
  @keyframes lgPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(216,178,90,0); }
    35%{ box-shadow:0 0 0 6px rgba(216,178,90,.25); } 70%{ box-shadow:0 0 0 2px rgba(216,178,90,.12); } }
  .lg-card{ position:absolute; left:8px; bottom:38px; width:236px; padding:10px 12px 11px;
    background:rgba(13,11,7,.95); border:1px solid var(--line); border-radius:10px;
    font-size:11.5px; color:var(--ink-dim); z-index:60; display:none; text-align:left; }
  .lg-card.open{ display:block; }
  .lg-title{ font-size:11px; letter-spacing:1px; color:var(--ink-faint); margin-bottom:7px; }
  .lg-row{ display:flex; align-items:center; gap:8px; padding:3px 0; }
  .lg-row.lg-dim{ color:var(--ink-faint); }
  .lg-priv{ font-style:normal; font-size:10px; color:var(--ink-faint); }
  .lg-note{ margin-top:7px; padding-top:6px; border-top:1px dashed var(--line); font-size:10.5px; color:var(--ink-faint); }
  /* 图例内的示例 token 走静态摆放：去掉绝对定位/动画 */
  .lg-card .vote-badge, .lg-card .badge{ position:static; animation:none; flex:0 0 auto; }
  .lg-card .tk, .lg-card .dchip{ animation:none; }

  /* ---- 桌径分档（container query）：<560px 铭牌走小档（塌叠 420px 桌时
       相邻座位中心弦距 ≈150px > 88px 铭牌宽，实测安全） ---- */
  @container table (max-width:560px){
    .seat{ width:88px; }
    .seat .avatar{ width:50px; height:50px; }
    .seat .avatar .ch{ font-size:21px; }
    .seat.dead .avatar::after{ font-size:24px; }
    .plate{ max-width:88px; padding:2px 5px 3px; }
    .p-name{ font-size:11px; }
    .tk{ width:15px; height:15px; font-size:9px; }
    .tk-role{ font-size:9px; height:14px; padding:0 5px; }
    .dchip{ font-size:9px; height:14px; padding:0 5px; }
    .seat .vote-badge{ min-width:16px; height:16px; font-size:10px; line-height:14px; border-radius:8px; left:-4px; top:-4px; }
    .plaque{ gap:7px; padding:5px 11px 6px; }
    .plaque .pq-round{ font-size:13.5px; }
    .plaque .pq-phase{ font-size:11px; }
    .plaque .pq-alive{ font-size:10px; }
    .stage.reveal{ max-width:270px; padding:10px 11px 11px; }
    .rv-row{ height:26px; }
    .rv-name{ font-size:11.5px; }
    .stg-title{ font-size:15px; letter-spacing:3px; }
    .stage .spk-line{ font-size:12px; }
  }

  /* ============ 右：发言流（唯一长滚动区）+ 底部操作区 ============ */
  .chat{ grid-area:chat; border-left:1px solid var(--line); background:rgba(0,0,0,.18);
         display:flex; flex-direction:column; min-height:0; }
  .stream{ flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; gap:10px; align-items:flex-start; max-width:min(92%,620px); }
  .row.self{ align-self:flex-end; flex-direction:row-reverse; }
  .bubble{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:8px 13px; line-height:1.55; }
  .row.self .bubble{ background:#2f3a2a; border-color:#41502f; }
  .bubble .who{ font-size:11.5px; font-weight:600; margin-bottom:1px; }
  .bubble .tx{ font-size:14.5px; color:var(--ink); white-space:pre-wrap; }
  .notice{ align-self:center; max-width:94%; display:flex; gap:8px; align-items:baseline; padding:6px 12px;
    border-radius:10px; font-size:13px; line-height:1.5; background:var(--bg-2); border:1px solid var(--line); color:var(--ink-dim); }
  .notice .ntag{ flex:0 0 auto; font-size:10.5px; font-weight:700; color:var(--ink-faint); }
  .notice.host{ background:#20281f; border-color:#344029; }
  .notice.vote{ background:var(--vote-bg); border-color:var(--vote-line); color:var(--vote-ink); }
  .typing{ display:inline-flex; gap:3px; align-items:center; }
  .typing .dot{ width:4px; height:4px; border-radius:50%; background:var(--gold-soft); animation:blink 1.2s infinite both; }
  .typing .dot:nth-child(2){ animation-delay:.2s } .typing .dot:nth-child(3){ animation-delay:.4s }
  @keyframes blink{ 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  ::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:#3a3328; border-radius:8px; }

  /* 操作区：右列底部（红线不变）。投票期间这里是全页唯一出现「你投了谁」的地方。
     target 按钮 hover → 对应座位 .aim 金色虚线瞄准环（零新增信息，纯空间对齐）。 */
  .controls{ border-top:1px solid var(--line); background:rgba(0,0,0,.22); padding:12px 16px 14px;
             display:flex; flex-direction:column; gap:10px; }
  .controls .hint{ margin:0; font-size:14px; color:var(--ink-dim); }
  .controls .hint.faint{ color:var(--ink-faint); font-size:13px; }
  .target-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .target{ font:inherit; cursor:pointer; padding:7px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--ink); font-size:13.5px; }
  .target:hover{ border-color:var(--gold-soft); }
  .target.selected{ background:linear-gradient(180deg,#d8b25a,#b8954a); color:#2a210c; border-color:var(--gold-soft); font-weight:600; }
  .action-row{ display:flex; align-items:center; gap:10px; }
  .action-row .sp{ flex:1; }
  .btn{ font:inherit; cursor:pointer; padding:9px 20px; border-radius:var(--radius-sm); border:1px solid var(--gold-soft);
        color:#2a210c; font-weight:600; background:linear-gradient(180deg,#d8b25a,#b8954a); }
  .btn:hover{ filter:brightness(1.05); }
  .btn.ghost{ background:transparent; color:var(--ink-dim); border-color:var(--line); font-weight:500; }
  .vote-confirm{ display:flex; flex-direction:column; gap:2px; padding:8px 12px; border-radius:9px;
    background:var(--vote-bg); border:1px solid var(--vote-line); }
  .vote-confirm .vc-main{ font-size:13px; color:var(--vote-ink); font-weight:600; }
  .vote-confirm .vc-sub{ font-size:12px; color:var(--ink-faint); }

  /* ============ 窄屏塌叠（≤1160px，预览级安全网） ============
     dock 已删：单列顺序 = 牌桌(≤420px，铭牌自动走小档) → 发言流 → 档案。
     tooltip 走 tap（.tip-on 已实现）；正式落地可升级为「点击座位弹档案抽屉」
     （嫁接 C 的触屏兜底），信息面板收进顶栏抽屉。 */
  @media (max-width:1160px){
    body{ overflow:auto; }
    .demo-bar{ height:auto; min-height:var(--demo-h); padding:6px 14px; }
    .frame{ display:flex; flex-direction:column; height:auto; min-height:calc(100vh - var(--demo-h)); }
    .table-wrap{ order:1; padding:16px; }
    .table{ width:min(100vw - 32px, 420px); }
    .chat{ order:2; border-left:none; min-height:60vh; }
    .stream{ max-height:none; }
    .controls{ position:sticky; bottom:0; z-index:5; background:var(--bg-1); }
    .info{ order:3; border-right:none; border-top:1px solid var(--line); }
  }

  /* 可达性：reduce 时全部 stagger/scale/位移/呼吸/脉冲一帧直出终态 */
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>

<body class="is-day">

  <div class="demo-bar">
    <strong>圆桌剧场 v3 · 信息上桌</strong>
    <button class="st-btn on" data-st="1">① 投票中（保密）</button>
    <button class="st-btn" data-st="2">② 开票揭示</button>
    <button class="st-btn" data-st="3">③ 平票加赛</button>
    <button class="st-btn" data-st="4">④ 放逐宣判</button>
    <button class="st-btn" data-st="5">⑤ 遗言</button>
    <span class="dv"></span>
    <span class="lbl nb">视角</span>
    <button class="vw-btn on" data-vw="seer">预言家</button>
    <button class="vw-btn" data-vw="wolf">狼人</button>
    <button class="vw-btn" data-vw="witch">女巫</button>
    <button class="vw-btn" data-vw="villager">村民</button>
    <span class="spacer"></span>
    <button id="btn-replay" disabled>↺ 重播动画</button>
  </div>

  <div class="frame">
    <!-- 左：过程档案（夜报 + 投票记录，仅此两节；idcard/查验/药剂/狼队/死亡公告
         全部上桌或进角色胶囊 tooltip） -->
    <aside class="info">
      <div class="info-head" id="info-head">📜 <b>过程档案</b></div>
      <div class="info-body" id="info-body"></div>
    </aside>

    <!-- 中：牌桌（视觉主体 + 信息主体；桌心铭牌/座位铭牌/图例由 JS 注入） -->
    <div class="table-wrap">
      <div class="table" id="table">
        <div class="felt"></div>
      </div>
    </div>

    <!-- 右：发言流 + 底部操作区（一字不动的红线区） -->
    <div class="chat">
      <div class="stream" id="stream"></div>
      <div class="controls" id="controls"></div>
    </div>
  </div>

<script>
  /* =====================================================================
     假数据剧本（7 人标准局，公开线与 v2b 一致）：
       夜1：狼刀乔木(1号)、女巫用解药救回（公开=平安夜）
       白1：首轮 沈舟3 / 阿岚2 / 小满1 / 弃1 → 沈舟被放逐
       夜2：林夜(4号)倒牌 → 白2：首轮 阿岚2/小满2/弃1 平票 → 加赛 阿岚3/小满1/弃1 → 阿岚被放逐
     四视角私密取样（注意：各视角是独立演示数据、一次只看一个 viewer 的桌面，
     不构成同一局自洽剧本——落地时全部由该 viewer 的 vi.privateEvents 派生）：
       · 预言家（沿用 v2b：你=3号）：夜1 查杀沈舟、夜2 查杀阿岚
       · 狼人：两狼=你+沈舟（vi.teammates=[沈舟]，2 狼板没有第三狼；
         夜2 刀林夜=你出的刀，得手的刀不挂 token）；夜1 刀乔木未得手（kill_result killed:false）
       · 女巫：夜1 倒牌乔木→用解药救回（解药已用）；夜2 倒牌林夜、未用毒（毒药可用）
       · 村民：零私密——桌面只剩公开层（信息弱势≠视觉噪音）
     ===================================================================== */
  const SEATVAR=['--seat-1','--seat-2','--seat-3','--seat-4','--seat-5','--seat-6'];
  const P={
    1:{name:'乔木', ch:'乔'},
    2:{name:'小满', ch:'满'},
    3:{name:'你',   ch:'你', you:true},
    4:{name:'林夜', ch:'夜'},
    5:{name:'沈舟', ch:'舟'},
    6:{name:'阿岚', ch:'岚'},
    7:{name:'白露', ch:'露'},
  };
  const seatColor=s=>`var(${SEATVAR[(s-1)%6]})`;
  const nameColor=s=>P[s].you?'var(--gold)':seatColor(s);
  const NM=s=>`<b class="nb" style="color:${nameColor(s)};font-weight:600">${P[s].name}<span style="color:var(--ink-faint);font-weight:400">（${s}号）</span></b>`;
  // link 参数：带 data-seat-link 的记录元素 hover 时联动对应座位 .hl 外晕
  const pav=(s,size,cls,link)=>`<span class="pav ${cls||''}" ${link?`data-seat-link="${link}"`:''} style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.46)}px;background:${seatColor(s)}">${P[s].ch}</span>`;

  /* ---- 视角定义（角色胶囊 = 身份卡/职责提示文案的归宿） ---- */
  const VW={
    seer:    { role:'预言家', tip:'预言家 · 好人阵营 · 每夜可查验一人身份', wolfy:false },
    wolf:    { role:'狼人',   tip:'狼人 · 狼人阵营 · 每夜与同伴袭击一人',   wolfy:true  },
    witch:   { role:'女巫',   tip:'女巫 · 好人阵营 · 一瓶解药一瓶毒药，各限用一次', wolfy:false },
    villager:{ role:'村民',   tip:'村民 · 好人阵营 · 无夜间能力，靠发言与投票推理', wolfy:false },
  };

  /* ---- 私密夜报（左列流水兜底：只放没有座位锚点的条目；
          救回/查验/守护细节都归座位 token，此处不重复）。
          狼人条目规则=仅空刀夜一行，本剧本没有空刀夜 → 空。
          注意「不重复」纪律：夜2 倒牌林夜已被公开死因牌覆盖，此行的
          增量是女巫的私密决策「未用毒」——纯重复公开事实的行不许进夜报。 ---- */
  const NIGHT_REPORT={
    seer:[], villager:[], wolf:[],
    witch:[ {n:1, seat:1, txt:()=>`倒牌：${NM(1)}`},
            {n:2, seat:4, txt:()=>`倒牌：${NM(4)}<span class="nb" style="color:var(--ink-faint)"> · 你未用毒</span>`} ],
  };

  /* ---- 票型数据（vote_resolved payload.votes / payload.tally）——公开层，
          四视角完全一致。【保密不变量】veil 态渲染路径不接触它们。 ---- */
  const D1_FIRST={ votes:[{v:1,t:5},{v:3,t:5},{v:7,t:5},{v:2,t:6},{v:4,t:6},{v:5,t:2},{v:6,abs:true}],
                   result:{outcome:'exile', t:5, n:3} };
  const D2_FIRST={ votes:[{v:1,t:6},{v:3,t:6},{v:6,t:2},{v:7,t:2},{v:2,abs:true}],
                   // 意群防拆词：balance 换行只许发生在意群之间（.nb 岛）
                   result:{outcome:'tie', ties:[2,6], txt:'平票（<span class="nb">小满 2</span> / <span class="nb">阿岚 2</span>）<span class="nb">→ 进入加赛</span>'} };
  const D2_TIE  ={ votes:[{v:1,t:6},{v:3,t:6},{v:7,t:6},{v:6,t:2},{v:2,abs:true}],
                   result:{outcome:'exile', t:6, n:3} };

  function groupVotes(votes){
    const by={}, abst=[];
    votes.forEach(o=>{ if(o.abs){ abst.push(o.v); } else { (by[o.t]=by[o.t]||[]).push(o.v); } });
    const groups=Object.keys(by).map(t=>({t:+t, voters:by[t]})).sort((a,b)=>b.voters.length-a.voters.length || a.t-b.t);
    return {groups, abst};
  }

  /* ================= 桌面徽标（ISO-001 核心）=================
     落地纪律：以下三个函数的每个分支都必须由 viewer 作用域 selector 从
     vi.privateEvents / vi.teammates 派生；座位组件只吃派生结果，
     绝不接触跨 viewer 数据。四视角各写 DOM 快照测试互斥断言。 */

  const tk=(kind,ch,tip)=>`<span class="tk tk-${kind} tt" data-tip="${tip}">${ch}</span>`;

  // 私密圆 token：token 全部产生于夜晚结算（天亮公告帧），投票中绝不新增
  function privateTokens(seat, vw){
    const t=[];
    if(vw==='seer'){                       // vi.privateEvents: seer_check_result
      if(seat===5) t.push(tk('wolf','狼','第1夜查验 · 狼人 · 仅你可见'));
      if(seat===6) t.push(tk('wolf','狼','第2夜查验 · 狼人 · 仅你可见'));
      // 金水示例（本剧本无）：tk('good','好','第N夜查验 · 好人 · 仅你可见')
    }else if(vw==='wolf'){
      if(seat===5) t.push(tk('wolf','狼','你的狼队友 · 仅你可见'));   // vi.teammates（2狼板=你+沈舟）
      if(seat===1) t.push(tk('knife','刀','第1夜 刀了乔木 · 未得手 · 仅你可见')); // kill_result killed:false；得手的刀不挂（公开死因牌已覆盖）
    }else if(vw==='witch'){                // witch_save / witch_poison submitted
      if(seat===1) t.push(tk('save','救','第1夜 你用解药救回 · 仅你可见'));
      // 毒杀 token 示例（本局未用毒）：必须与公开死因牌同帧渲染，不得早于 death 事件
    }
    // 守卫兼容（7人板无守卫）：tk('guard','守','第N夜守护 · 仅你可见')
    return t;
  }

  // own seat 角色胶囊 + 女巫药剂 pip（身份卡/职责提示/药剂状态卡的归宿）
  function ownTokens(vw){
    const v=VW[vw];
    let html=`<span class="tk-role tt ${v.wolfy?'wolfy':''}" data-tip="${v.tip}">${v.role}</span>`;
    if(vw==='witch'){
      html+=`<span class="pip pip-save used tt" data-tip="解药 · 已用（第1夜救了乔木）"></span>`;
      html+=`<span class="pip pip-poison tt" data-tip="毒药 · 可用"></span>`;
    }
    return html;
  }

  // 公开死因胶囊（vi.deadPlayers，全员同款）。×N=放逐票数持久层，vote_resolved 同帧
  function deathChip(seat, st){
    if(seat===5) return `<span class="dchip tt" data-tip="第1天 被放逐（3票）· 详见投票记录">逐·天1 <i class="xn">×3</i></span>`;
    if(seat===4) return `<span class="dchip tt" data-tip="第2夜 夜里出局">刀·夜2</span>`;
    if(seat===6 && st>=4){
      const d=(st===4)?1.55:0; // ④ 宣判(≈0.96s)→票数角标(1.3s)→死因chip(1.55s) 顺序落地
      // .fresh：本轮新生 chip 豁免 revealing 降透明（否则以 30% 透明度出生，到 2.6s 才亮）
      return `<span class="dchip fresh tt" data-tip="第2天 被放逐（3票）· 详见投票记录" style="--d:${d}s">逐·天2 <i class="xn">×3</i></span>`;
    }
    return '';
  }

  /* ================= 左列：过程档案 ================= */
  function vfRound(sub, data, opts){
    opts=opts||{};
    let html=`<div class="vr"><div class="vr-sub">${sub}</div>`;
    if(!data){ // 进行中：零票向（viewer 自己的票只在操作区 vote-confirm 出现）
      html+=`<div class="vf-pending nb">🕐 暗投进行中 · 开票时公示</div>`;
      if(opts.waitYou){ html+=`<div class="vf-mine nb">等待你投票…</div>`; }
      return html+`</div>`;
    }
    const {groups, abst}=groupVotes(data.votes);
    const max=groups.length?groups[0].voters.length:1;
    groups.forEach(g=>{
      const exiled=data.result.outcome==='exile'&&data.result.t===g.t;
      const chips=g.voters.map(v=>pav(v,16,'',v)).join('');
      // 目标只放 头像+短名（不带「（N号）」——228px 窄列下号码会把票数挤出行外；
      // 座位号信息由 hover 联动(.hl 外晕)与开票榜/banner 全称兜底
      html+=`<div class="vf-row ${exiled?'exiled':''}">
        <span class="vf-chips">${chips}</span><span class="vf-arr">→</span>
        <span class="vf-tgt" data-seat-link="${g.t}">${pav(g.t,20)}<b class="nb" style="color:${nameColor(g.t)};font-weight:600">${P[g.t].name}</b></span>
        <span class="vf-bar"><i style="width:${Math.round(g.voters.length/max*100)}%"></i></span>
        <span class="vf-n">${g.voters.length}</span></div>`;
    });
    if(abst.length){
      html+=`<div class="vf-row abs">
        <span class="vf-chips">${abst.map(v=>pav(v,16,'',v)).join('')}</span><span class="vf-arr"></span>
        <span class="vf-tgt nb">弃票</span><span class="vf-bar" style="visibility:hidden"></span>
        <span class="vf-n">${abst.length}</span></div>`;
    }
    const r=data.result;
    if(r.outcome==='exile'){
      html+=`<div class="vf-banner exile">${NM(r.t)} <span class="nb">被放逐（${r.n} 票）</span></div>`;
    }else if(r.outcome==='tie'){
      // 注意：.vf-banner 的 text-wrap:balance 会重置 .nb 的 nowrap（shorthand 覆盖
      // text-wrap-mode），所以防拆词的 .nb 岛必须放在 txt 内部而非 banner 外层
      html+=`<div class="vf-banner tie">${r.txt}</div>`;
    }else{
      html+=`<div class="vf-banner tie"><span class="nb">无人被放逐，</span><span class="nb">直接入夜</span></div>`;
    }
    return html+`</div>`;
  }

  function voteDayCard(day, open, sum, body){
    return `<div class="vote-day ${open?'open':''}">
      <div class="vd-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="vd-arrow">▸</span><span class="nb">第 ${day} 天</span><span class="vd-sum">${sum}</span></div>
      <div class="vd-body">${body}</div></div>`;
  }
  const DAY1_CARD=open=>voteDayCard(1, open, `放逐 ${NM(5)}`, vfRound('首轮', D1_FIRST));

  function renderInfo(st, vw){
    // ① 夜报（仅有内容的角色渲染；行 hover 联动对应座位）
    const rep=NIGHT_REPORT[vw];
    let night='';
    if(rep.length){
      night=`<div class="psec"><h4>🌙 夜报 · 仅你可见</h4>`+
        rep.map(r=>`<div class="nrow" data-seat-link="${r.seat}"><span class="n-when nb">夜${r.n}</span><span>${r.txt()}</span></div>`).join('')+
      `</div>`;
    }
    // ② 投票记录（公开，四视角一致）
    let d2body='', d2sum='', flash=(st===5);
    if(st===1){ d2sum='进行中'; d2body=vfRound('首轮', null, {}); }
    else if(st===2){ d2sum='平票 · 待加赛'; d2body=vfRound('首轮', D2_FIRST); }
    else if(st===3){ d2sum='进行中'; d2body=vfRound('首轮', D2_FIRST)+vfRound('加赛', null, {waitYou:true}); }
    else { d2sum=`放逐 ${NM(6)}`; d2body=vfRound('首轮', D2_FIRST)+vfRound('加赛', D2_TIE); }
    document.getElementById('info-head').innerHTML=
      `📜 <b>过程档案</b>${rep.length?' · 夜报仅你可见':''}`;
    document.getElementById('info-body').innerHTML=night+
      `<div class="psec vote-sec ${flash?'flash':''}"><h4>🗳️ 投票记录</h4>`+
      voteDayCard(2, true, d2sum, d2body)+DAY1_CARD(false)+`</div>`;
  }

  /* ================= 中列：牌桌 ================= */
  function seatPos(i,total){
    // y 半径 44% → 42%：铭牌比 v2b 座位高 ~18px，顶/底位座位内收一档
    const ang=(-90+i*360/total)*Math.PI/180;
    return {x:50+43*Math.cos(ang), y:50+42*Math.sin(ang)};
  }

  const PHASE={1:'白天 · 投票',2:'白天 · 开票',3:'白天 · 平票加赛',4:'白天 · 开票',5:'白天 · 遗言'};

  // 桌心铭牌：轮次 + 阶段 + 存活（topbar 替身）。投票中转 vote 蓝灰；
  // 夜晚时 pq-phase 吃掉 vi.nightStatus 播报（本演示均为白天）。
  function plaqueHtml(st){
    const alive=(st>=4)?4:5;
    return `<div class="plaque ${(st===1||st===3)?'vote':''}">
      <span class="pq-round nb">第 2 天</span>
      <span class="pq-phase nb">${PHASE[st]}</span>
      <span class="pq-alive nb">存活 ${alive}/7</span></div>`;
  }

  // ❔ 图例：按 viewer 只列他见得到的种类（形状编码的教学入口）
  function legendHtml(vw, remind){
    const PRIV={
      seer:[ ['tk tk-wolf','狼','查验为狼人'], ['tk tk-good','好','查验为好人（金水）'] ],
      wolf:[ ['tk tk-wolf','狼','你的狼队友'], ['tk tk-knife','刀','出刀未得手'] ],
      witch:[ ['tk tk-save','救','解药救回'], ['tk tk-poison','毒','毒药目标'] ],
      villager:[],
    }[vw];
    let rows=PRIV.map(r=>`<div class="lg-row"><span class="${r[0]}">${r[1]}</span><span>${r[2]} <i class="lg-priv nb">· 仅你可见</i></span></div>`).join('');
    if(vw==='witch'){ rows+=`<div class="lg-row"><span class="pip pip-save"></span><span>药剂 pip：实心=可用 / 空心=已用 <i class="lg-priv nb">· 仅你可见</i></span></div>`; }
    if(!PRIV.length){ rows=`<div class="lg-row lg-dim">你没有夜间私密情报，<span class="nb">桌面只有公开标记</span></div>`; }
    rows+=`<div class="lg-row"><span class="dchip">逐·天1 <i class="xn">×3</i></span><span>死因牌 · 公开</span></div>`;
    rows+=`<div class="lg-row"><span class="vote-badge">3</span><span>得票数 · 开票后公开</span></div>`;
    rows+=`<div class="lg-row"><span class="badge tie">平</span><span>平票候选 · 公开</span></div>`;
    return `<button class="lg-btn ${remind?'remind':''}" id="lg-btn" title="桌面标记图例">?</button>
      <div class="lg-card" id="lg-card"><div class="lg-title">桌面标记图例</div>${rows}
      <div class="lg-note nb">圆形 = 仅你可见 · 胶囊/角标 = 全场公开</div></div>`;
  }

  let dimTimer=null, lgOpen=false, lgRemind=true; // lgRemind：切视角后单次呼吸提醒
  function renderTable(st, vw){
    const table=document.getElementById('table');
    table.querySelectorAll('.seat,.stage,.plaque,.lg-btn,.lg-card').forEach(n=>n.remove());
    table.classList.toggle('veiled', st===1||st===3);   // 投票进行中：压暗封桌
    // 开票帧：金脉冲 + 既有 token 退让（~2.6s 后恢复）
    clearTimeout(dimTimer);
    const revealing=(st===2||st===4);
    table.classList.toggle('revealing', revealing);
    const felt=table.querySelector('.felt');
    felt.classList.remove('pulse'); void felt.offsetWidth;
    if(revealing){
      felt.classList.add('pulse');
      dimTimer=setTimeout(()=>table.classList.remove('revealing'), 2600);
    }

    const dead=(st>=4)?[4,5,6]:[4,5];
    const tied=(st===3)?[2,6]:[];
    // 票数角标（vote_resolved payload.tally；结算前绝不渲染）
    let badges={};
    if(st===2){ badges={6:{n:2,delay:1.3},2:{n:2,delay:1.36}}; }
    if(st===4){ badges={6:{n:3,exiled:true,delay:1.3},2:{n:1,delay:1.36}}; }
    if(st===5){ badges={6:{n:3,exiled:true,delay:0},2:{n:1,delay:0}}; }

    const seats=[1,2,3,4,5,6,7];
    seats.forEach((s,i)=>{
      const pos=seatPos(i,seats.length);
      const isDead=dead.includes(s), isTied=tied.includes(s);
      const el=document.createElement('div');
      // .s-top/.s-bot：按半球决定 tooltip 弹出方向（顶位向下弹防桌缘裁切）
      el.className='seat'+(isDead?' dead':'')+(isTied?' tied':'')+(pos.y<50?' s-top':' s-bot');
      el.dataset.seat=s;
      el.style.left=pos.x+'%'; el.style.top=pos.y+'%';
      const b=badges[s];
      const voteBadge=b?`<span class="vote-badge ${b.exiled?'exiled':''}" style="--d:${b.delay}s">${b.n}</span>`:'';
      const idBadge=P[s].you?'<span class="badge you">你</span>':(isTied?'<span class="badge tie">平</span>':'');
      // 徽标行 = 私密 token + own 角色胶囊 + 公开死因 chip；max 3 兜底「+N」
      const toks=privateTokens(s,vw);
      if(P[s].you) toks.push(ownTokens(vw));
      const dc=deathChip(s,st); if(dc) toks.push(dc);
      if(toks.length>3){ const extra=toks.length-3; toks.length=3; toks.push(`<span class="tk tk-more">+${extra}</span>`); }
      const row=toks.length?`<div class="p-row">${toks.join('')}</div>`:'';
      const stLine=(st===5&&s===6)?`<div class="p-st nb">遗言中</div>`:'';
      el.innerHTML=`<div class="avwrap"><div class="avatar" style="background:${seatColor(s)}"><span class="ch">${P[s].ch}</span></div>${idBadge}${voteBadge}</div>
        <div class="plate">
          <div class="p-name" style="${!isDead?`color:${nameColor(s)}`:''}">${P[s].name}<span class="no">（${s}）</span></div>
          ${row}${stLine}
        </div>`;
      table.appendChild(el);
    });

    table.insertAdjacentHTML('beforeend', plaqueHtml(st));
    table.insertAdjacentHTML('beforeend', stageHtml(st));
    table.insertAdjacentHTML('beforeend', legendHtml(vw, lgRemind));
    lgRemind=false;
    const lgBtn=document.getElementById('lg-btn'), lgCard=document.getElementById('lg-card');
    lgCard.classList.toggle('open', lgOpen);
    lgBtn.addEventListener('click', e=>{
      e.stopPropagation(); lgOpen=!lgOpen; lgCard.classList.toggle('open', lgOpen);
    });
  }

  /* ---- 舞台三态（v2b 原样继承） ---- */
  function veilStage(opts){
    const sub=opts.canAct
      ? `<span class="nb">请在右下操作区投出你的一票</span>`
      : `<span class="nb">暗投进行中</span><span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;
    // .nb 挂内层 span：stg-title/veil-note 自带 text-wrap:balance，
    // 同元素 balance 后声明会覆盖 .nb 的 text-wrap-mode:nowrap（见 vf-banner 处注释）
    return `<div class="stage veil">
      <div class="stg-title"><span class="nb">${opts.title}</span></div>
      <div class="stg-sub">${sub}</div>
      <div class="vbox" aria-hidden="true"></div>
      <div class="veil-note"><span class="nb">所有选票将在开票时一次性公示</span></div></div>`;
  }

  function revealStage(sub, data){
    const {groups, abst}=groupVotes(data.votes);
    let rows='', i=0;
    groups.forEach(g=>{
      const d=(i*0.12).toFixed(2);
      const chips=g.voters.map((v,j)=>{
        const dc=(i*0.12+0.15+j*0.06).toFixed(2);
        return `<span class="pav" data-seat-link="${v}" style="width:20px;height:20px;font-size:10px;background:${seatColor(v)};--dc:${dc}s">${P[v].ch}</span>`;
      }).join('');
      rows+=`<div class="rv-row" style="--d:${d}s">${pav(g.t,26,'',g.t)}<span class="rv-name" style="color:${nameColor(g.t)}">${P[g.t].name}</span><span class="rv-chips">${chips}</span><span class="rv-n">${g.voters.length}</span></div>`;
      i++;
    });
    if(abst.length){
      const d=(i*0.12).toFixed(2);
      const chips=abst.map((v,j)=>{
        const dc=(i*0.12+0.15+j*0.06).toFixed(2);
        return `<span class="pav" data-seat-link="${v}" style="width:20px;height:20px;font-size:10px;background:var(--bg-3);color:var(--ink-faint);--dc:${dc}s">${P[v].ch}</span>`;
      }).join('');
      rows+=`<div class="rv-row abs" style="--d:${d}s"><span class="rv-name nb">弃票</span><span class="rv-chips">${chips}</span><span class="rv-n">${abst.length}</span></div>`;
      i++;
    }
    const vd=(i*0.12+0.6).toFixed(2);
    const r=data.result;
    let verdict='', cls='';
    if(r.outcome==='exile'){
      cls='exile';
      verdict=`<div class="rv-verdict" style="--dv:${vd}s">${pav(r.t,72,'rv-exile-av')}
        <div class="vtext">${NM(r.t)} <span class="nb">被放逐（${r.n} 票）</span></div></div>`;
    }else if(r.outcome==='tie'){
      verdict=`<div class="rv-verdict" style="--dv:${vd}s">
        <div class="rv-ties">${r.ties.map(s=>pav(s,52,'rv-tie-av')).join('')}</div>
        <div class="vtext"><span class="nb">平票 → 发言后加赛</span></div></div>`;
    }else{
      verdict=`<div class="rv-verdict" style="--dv:${vd}s">
        <div class="vtext dim" style="color:var(--ink-dim)"><span class="nb">无人被放逐，即将入夜</span></div></div>`;
    }
    return `<div class="stage reveal ${cls}" style="${cls==='exile'?`--dv:${vd}s`:''}">
      <div class="stg-title"><span class="nb">开票 · ${sub}</span></div>
      <div class="rv-list">${rows}</div>${verdict}</div>`;
  }

  function speechStage(seat, line){
    return `<div class="stage">${pav(seat,88,'spk-av')}
      <div class="spk-name nb">${P[seat].name}（${seat}号）</div>
      <div class="spk-line">${line}</div></div>`;
  }

  function stageHtml(st){
    if(st===1) return veilStage({title:'投票表决', canAct:false});
    if(st===2) return revealStage('首轮', D2_FIRST);
    if(st===3) return veilStage({title:'平票加赛', canAct:true});
    if(st===4) return revealStage('加赛', D2_TIE);
    return speechStage(6, '行吧，票出我。最后说一句：小满的票从头到尾都在避重就轻，明天重点看她。');
  }

  /* ================= 右列：发言流 + 操作区 ================= */
  const bubble=(s,tx)=>`<div class="row ${P[s].you?'self':''}">${pav(s,36,'',s)}
    <div class="bubble"><div class="who" style="color:${nameColor(s)}">${P[s].name}（${s}号）</div>
    <div class="tx">${tx}</div></div></div>`;
  const notice=(cls,tag,tx)=>`<div class="notice ${cls}"><span class="ntag">${tag}</span><span>${tx}</span></div>`;

  // 发言是公开信息，但「谁在跳预言家」随视角变：预言家视角=你自己在报查杀；
  // 其他视角=白露(7号)在跳，你只是听众（避免非预言家 viewer 出现自己报查验的怪话）
  function chatBase(vw){
    const head=notice('host','主持人',`天亮了。昨晚 ${NM(4)} 夜里出局。`);
    if(vw==='seer'){
      return head+
        bubble(1,'昨晚林夜倒了。我继续站边 3 号预言家，昨天的查杀已经应验，今天听他的。')+
        bubble(3,'第二晚我验的是阿岚——查杀。两狼已经找到一只，今天出阿岚，好人别乱票。')+
        bubble(7,'查杀我记下了。但小满从头到尾躲在后面不表态，我更想先看看她的态度。');
    }
    return head+
      bubble(1,'昨晚林夜倒了。我继续站边 7 号预言家，昨天的查杀已经应验，今天听她的。')+
      bubble(7,'第二晚我验的是阿岚——查杀。两狼已经找到一只，今天出阿岚，好人别乱票。')+
      bubble(3,'查杀我记下了，我的票跟预言家走。另外小满一直不表态，今天也得给个说法。');
  }

  function renderChat(st, vw){
    let html=chatBase(vw);
    if(st===1){
      html+=notice('vote','投票',`投票进行中 · <span class="nb">暗投，开票时公示</span>`);
    }else if(st===2){
      html+=notice('vote','投票',`开票 · 首轮：${NM(2)} 2 票 / ${NM(6)} 2 票 / 弃票 1 —— <span class="nb">平票，进入加赛</span>`);
    }else if(st>=3){
      html+=notice('vote','投票',`开票 · 首轮：${NM(2)} 2 票 / ${NM(6)} 2 票 / 弃票 1 —— <span class="nb">平票，进入加赛</span>`)+
        notice('host','主持人',`平票加赛：请 ${NM(2)}、${NM(6)} 依次发言。`)+
        bubble(2,'我发言少是因为没信息，不是躲。我的票没有一张有问题。')+
        bubble(6,'我不是狼。预言家的查杀我不认，真狼正躲在查杀后面带节奏。');
    }
    if(st===3){ html+=notice('vote','投票',`加赛投票进行中 · <span class="nb">暗投，开票时公示</span>`); }
    if(st>=4){ html+=notice('vote','投票',`开票 · 加赛：${NM(6)} 3 票 / ${NM(2)} 1 票 / 弃票 1`)+
      notice('host','主持人',`${NM(6)} 被放逐。`); }
    if(st===5){ html+=bubble(6,'行吧，票出我。最后说一句：小满的票从头到尾都在避重就轻，明天重点看她。'); }
    document.getElementById('stream').innerHTML=html;
    const el=document.getElementById('stream'); el.scrollTop=el.scrollHeight;
  }

  function renderControls(st){
    const c=document.getElementById('controls');
    if(st===1){
      // 【保密唯一出口】投票期间全页只有这里出现「你投了谁」
      c.innerHTML=`<div class="vote-confirm">
        <span class="vc-main nb">✓ 已投出：阿岚（6号）（暗投，开票时公示）</span>
        <span class="vc-sub nb">等待其他玩家投票… 你的票只有你自己可见</span></div>`;
    }else if(st===3){
      // target hover → 座位 .aim 瞄准环（data-aim，零新增信息）
      c.innerHTML=`<p class="hint">请进行二次投票：</p>
        <div class="target-grid">
          <button class="target" data-aim="2">小满（2号）</button>
          <button class="target selected" data-aim="6">阿岚（6号）</button>
        </div>
        <div class="action-row"><span class="sp"></span>
          <button class="btn ghost">弃票</button>
          <button class="btn">提交投票</button></div>`;
      c.querySelectorAll('.target').forEach(b=>b.addEventListener('click',()=>{
        c.querySelectorAll('.target').forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
      }));
    }else if(st===2||st===4){
      c.innerHTML=`<p class="hint faint nb">开票中，请稍候…</p>`;
    }else{
      c.innerHTML=`<p class="hint faint nb">阿岚（6号） 正在发表遗言…</p>`;
    }
  }

  /* ================= 记录↔座位联动 + 触屏 tooltip ================= */
  function seatEl(s){ return document.querySelector(`.seat[data-seat="${s}"]`); }
  document.addEventListener('mouseover', e=>{
    const l=e.target.closest('[data-seat-link]'); if(l){ const el=seatEl(l.dataset.seatLink); if(el) el.classList.add('hl'); }
    const a=e.target.closest('[data-aim]');       if(a){ const el=seatEl(a.dataset.aim);      if(el) el.classList.add('aim'); }
  });
  document.addEventListener('mouseout', e=>{
    const l=e.target.closest('[data-seat-link]'); if(l){ const el=seatEl(l.dataset.seatLink); if(el) el.classList.remove('hl'); }
    const a=e.target.closest('[data-aim]');       if(a){ const el=seatEl(a.dataset.aim);      if(el) el.classList.remove('aim'); }
  });
  // 触屏：tap 切换 tooltip（塌叠态兜底；落地可升级为点击座位弹档案抽屉）
  document.addEventListener('click', e=>{
    const t=e.target.closest('.tt');
    document.querySelectorAll('.tt.tip-on').forEach(x=>{ if(x!==t) x.classList.remove('tip-on'); });
    if(t) t.classList.toggle('tip-on');
  });

  /* ================= 状态机 + 演示条（5 态 × 4 视角正交） ================= */
  let current=1, viewer='seer';
  function render(){
    renderInfo(current, viewer);
    renderChat(current, viewer);
    renderControls(current);
    renderTable(current, viewer);
    document.querySelectorAll('.st-btn').forEach(b=>b.classList.toggle('on', +b.dataset.st===current));
    document.querySelectorAll('.vw-btn').forEach(b=>b.classList.toggle('on', b.dataset.vw===viewer));
    document.getElementById('btn-replay').disabled=!(current===2||current===4);
  }
  document.querySelectorAll('.st-btn').forEach(b=>b.addEventListener('click',()=>{ current=+b.dataset.st; render(); }));
  document.querySelectorAll('.vw-btn').forEach(b=>b.addEventListener('click',()=>{
    viewer=b.dataset.vw; lgRemind=true; render();   // 切视角：图例钮单次呼吸提醒
  }));
  document.getElementById('btn-replay').addEventListener('click',()=>render());
  render();
</script>
</body>
</html>
